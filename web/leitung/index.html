<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWH · Steuermodul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/wwh.css">
<style>
.nav{display:flex;align-items:stretch;flex-wrap:wrap;border-bottom:1px solid var(--kante);padding:0 clamp(12px,2vw,32px);position:sticky;top:0;background:var(--nacht);z-index:20;}
.nav .logo{font-family:var(--display);font-size:26px;padding:10px 24px 10px 0;}
.nav .tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--blass);font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:14px 12px;cursor:pointer;}
.nav .tab.an{color:var(--papier);border-bottom-color:var(--signal);}
.nav .tab.live{color:var(--signal);}
.nav .rechts{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;}
.nav .rechts .klein{margin-right:4px;}
.seg{display:inline-flex;border:1px solid var(--kante-hell);}
.seg button{background:transparent;border:none;padding:6px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--blass);}
.seg button.an{background:var(--papier);color:var(--nacht);}
main{padding:clamp(16px,2.4vw,40px);}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(20px,2.6vw,48px);align-items:start;}
.raster.cockpit{grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);}
@media (max-width:980px){.raster.cockpit{grid-template-columns:1fr;}}
.stapel{display:flex;flex-direction:column;gap:18px;}
.box{border:1px solid var(--kante);background:var(--nacht-2);padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
.box.hell{background:var(--papier);color:var(--nacht);border-color:var(--papier);}
.box.hell .klein{color:#5c5446;}
.box.alarm{border:2px solid var(--signal);}
h1,h2,h3{margin:0;font-weight:400;}
h1{font-family:var(--display);font-size:clamp(36px,4.6vw,80px);line-height:.92;text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto;}
h2{font-family:var(--display);font-size:clamp(26px,2.4vw,40px);line-height:1;text-transform:uppercase;}
.text{font-family:var(--serif);font-size:18px;line-height:1.45;margin:0;}
.gross{font-family:var(--serif);font-size:clamp(22px,2vw,32px);line-height:1.3;margin:0;}
.reihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.regeln{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:r;}
.regeln li{display:grid;grid-template-columns:32px 1fr;font-family:var(--serif);font-size:17px;line-height:1.4;counter-increment:r;}
.regeln li::before{content:counter(r,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--siegel);padding-top:4px;}
.tabelle{display:flex;flex-direction:column;}
.zeile{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--kante);}
.zeile.nah{background:#2e1a15;}
.zeile .wer b{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;display:block;line-height:1.05;}
.zeile .wer span{font-size:12px;color:var(--blass);}
.zeile .mitte{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;min-width:0;}
.zeile .aktion{display:flex;gap:6px;align-items:center;}
.zeile .punkte{font-family:var(--display);font-size:22px;min-width:3ch;text-align:right;}
.zeile .plus{color:var(--signal);font-size:13px;min-width:3ch;}
.feld.kurz{width:110px;padding:8px 10px;}
.feld.mittel{width:200px;padding:8px 10px;}
.pill{display:inline-block;border:1px solid var(--kante-hell);padding:3px 8px;font-size:12px;}
.pill.gut{border-color:var(--gruen);color:var(--gruen);}
.pill.schlecht{border-color:var(--signal);color:var(--signal);}
.pill.an{background:var(--papier);color:var(--nacht);border-color:var(--papier);}
.loesung{border-left:4px solid var(--signal);padding:6px 0 6px 14px;}
.loesung .display{font-size:clamp(28px,2.6vw,46px);}
.funk{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;}
.funk div{display:grid;grid-template-columns:70px 130px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--kante);padding:6px 0;font-size:14px;}
.funk div b{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:17px;}
.funk div.r{background:#1f2616;}
.funk .serif{font-size:17px;}
.plan{display:flex;flex-direction:column;gap:8px;}
.plan .p{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto auto auto auto;gap:12px;align-items:center;border:1px solid var(--kante);background:var(--nacht-2);padding:10px 14px;}
.plan .p.jetzt{border-color:var(--signal);}
.plan .p b{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;}
.katalog{display:flex;gap:8px;flex-wrap:wrap;}
.eintrag{border:1px solid var(--kante);background:var(--nacht-2);padding:14px 16px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;}
.eintrag .felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.eintrag label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blass);}
.eintrag label.breit{grid-column:1/-1;}
.eintrag textarea{min-height:110px;resize:vertical;}
.eintrag img{max-height:120px;max-width:100%;object-fit:contain;align-self:flex-start;border:1px solid var(--kante);}
.eintrag audio{width:100%;}
.untertabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--kante);}
.untertabs button{background:none;border:none;border-bottom:3px solid transparent;color:var(--blass);padding:10px 12px;cursor:pointer;font-size:13px;}
.untertabs button.an{color:var(--papier);border-bottom-color:var(--signal);}
.rang div{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--kante);align-items:baseline;}
.rang b{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;}
.rang small{color:var(--blass);font-size:12px;margin-left:8px;text-transform:none;font-family:var(--mono);}
.link{font-size:13px;word-break:break-all;}
.meldung{position:fixed;right:16px;bottom:16px;background:var(--siegel);color:var(--papier-hell);padding:12px 16px;z-index:99;max-width:420px;}
.lupe{position:relative;overflow:hidden;border:1px solid var(--kante-hell);height:240px;background:#000;}
.lupe img{width:100%;height:100%;object-fit:contain;}
.zellen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.zelle{border:1px solid var(--kante-hell);padding:12px 14px;}
.zelle h3{font-family:var(--display);font-size:22px;text-transform:uppercase;color:var(--signal);}
.brett{display:grid;gap:6px;}
.brett .kat{font-family:var(--display);font-size:15px;text-transform:uppercase;line-height:1.05;border-bottom:2px solid var(--signal);padding:0 2px 6px;display:flex;align-items:flex-end;hyphens:auto;min-width:0;overflow:hidden;}
.brett button{background:var(--nacht-2);border:1px solid var(--kante-hell);padding:14px 4px;font-family:var(--display);font-size:22px;cursor:pointer;position:relative;}
.brett button:hover{border-color:var(--signal);}
.brett button.weg{opacity:.25;}
.brett button.leer{border-style:dashed;opacity:.35;cursor:not-allowed;}
.brett button .rk{position:absolute;top:3px;right:5px;font-size:11px;color:var(--signal);font-family:var(--mono);}
.depfeld{border:2px solid var(--signal);padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:var(--nacht-2);}
.depfeld .html{font-family:var(--serif);font-size:20px;line-height:1.35;}
.depfeld .html img{max-height:180px;max-width:100%;}
.depfeld .antwort{background:var(--papier);color:var(--nacht);padding:12px 14px;}
.uhrtext{font-family:var(--display);font-size:30px;}
.uhrtext.aus{color:var(--signal);}
.buzzliste{display:flex;flex-direction:column;gap:6px;}
.buzzliste div{display:flex;gap:10px;align-items:center;border:1px solid var(--kante);padding:8px 10px;}
.buzzliste div.dran{border-color:var(--signal);background:#2e1a15;}
.buzzliste b{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;flex:1;}
.kbd{font-size:11px;color:var(--blass);}
.kbd kbd{border:1px solid var(--kante-hell);padding:0 5px;font-family:var(--mono);}
details.kat{border:1px solid var(--kante);background:var(--nacht-2);}
details.kat summary{padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;}
details.kat .karten{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px;}
.dkarte{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;border-top:1px solid var(--kante);padding-top:10px;}
.dkarte .p{font-family:var(--display);font-size:24px;}
.dkarte .felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.dkarte label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blass);}
.dkarte textarea{min-height:64px;resize:vertical;}
.aeintrag{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) minmax(0,.9fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--kante);padding:6px 0;}
.aeintrag .fehl{border-color:var(--signal);}
@media (max-width:900px){.aeintrag{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<main id="app"><p class="blass">Verbinde …</p></main>
<div class="meldung" id="meldung" hidden></div>
<script src="/wwh.js"></script>
<script>
const { esc, pad, poll, post, render, actions, fmtGain } = WWH;
const app = document.getElementById('app'), nav = document.getElementById('nav'), meldung = document.getElementById('meldung');
let S = null, M = null, LAN = '', GEO = {}, NAME2KEY = {};
fetch('/geo.json').then(r => r.json()).then(g => { GEO = g; Object.entries(g).forEach(([k, v]) => { if (!v.kein) NAME2KEY[v.name.toLowerCase()] = k; }); if (S) zeichnen(); });
const landName = k => (GEO[k] && GEO[k].name) || k || '';
const ui = { tab: 'zentrale', archiv: 'schaetzen', autoMission: true, boardId: null, board: null, boardDirty: false, setId: null };

function hinweis(t) { meldung.textContent = t; meldung.hidden = false; clearTimeout(hinweis.t); hinweis.t = setTimeout(() => meldung.hidden = true, 4000); }
async function cmd(c, args) { try { await post('/leitung/api/cmd', { cmd: c, ...(args || {}) }); } catch (e) { hinweis(e.message); } }

poll(() => '/leitung/api/state', d => {
  const war = S && S.screen;
  S = d.state; M = d.meta; LAN = d.lan; if (d.now) zeitDiff = d.now - Date.now() / 1000;
  if (S.screen === 'mission' && war !== 'mission') ui.tab = 'mission';
  zeichnen();
});

// ------------------------------------------------------------------ Helfer
const G = t => M.games[t];
const mission = () => S.plan[S.cur];
const agent = id => S.agents.find(a => a.id === id);
const code = id => (agent(id) || {}).code || '?';
const total = id => S.totals[id] || 0;
const sorted = () => [...S.agents].sort((a, b) => total(b.id) - total(a.id));
const basis = () => (S.joinUrl || LAN || location.origin + '/').replace(/\/?$/, '/');
const geraeteLink = a => basis() + '?t=' + encodeURIComponent(a.token);
const modusLabel = p => p.mode === 'team' ? 'Zelleneinsatz' : 'Einzeleinsatz';
const regeln = g => `<ol class="regeln">${g.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ol>`;
const kopieren = text => { (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => hinweis('Kopiert'), () => prompt('Kopieren:', text)); };

// ------------------------------------------------------------------ Rahmen
function zeichnen() {
  const m = mission();
  const tabs = [['mission', S.active ? 'Mission läuft' : 'Mission'], ['zentrale', 'Zentrale'], ['agenten', 'Agenten'], ['plan', 'Einsatzplan'], ['archiv', 'Archiv'], ['system', 'System']];
  nav.innerHTML = `<span class="logo">WWH</span>${tabs.map(([k, l]) => `<button class="tab ${ui.tab === k ? 'an' : ''} ${k === 'mission' && S.active ? 'live' : ''}" data-tab="${k}">${l}</button>`).join('')}
    <div class="rechts"><span class="klein">Leinwand</span><span class="seg">
      <button data-screen="start" class="${S.screen === 'start' ? 'an' : ''}">Start</button>
      <button data-screen="prolog" class="${S.screen === 'prolog' ? 'an' : ''}">Prolog</button>
      <button data-screen="hq" class="${S.screen === 'hq' ? 'an' : ''}">Zentrale</button>
      <button data-screen="mission" class="${S.screen === 'mission' ? 'an' : ''}" ${S.active ? '' : 'disabled'}>Mission</button>
      <button data-screen="finale" class="${S.screen === 'finale' ? 'an' : ''}">Übergabe</button></span>
      <a class="btn klein" href="/leinwand" target="wwh_leinwand">Leinwand öffnen</a></div>`;
  const seiten = { mission: seiteMission, zentrale: seiteZentrale, agenten: seiteAgenten, plan: seitePlan, archiv: seiteArchiv, system: seiteSystem };
  render(app, seiten[ui.tab]());
  hostUhr();
}
let hTakt = null, zeitDiff = 0;
function hostUhr() {
  clearInterval(hTakt);
  const el = document.getElementById('huhr'), d = S.dep;
  if (!el || !d) return;
  const takt = () => { const rest = d.tRun ? Math.max(0, d.tEnd - (Date.now() / 1000 + zeitDiff)) : d.tLeft; el.textContent = rest > 0 ? Math.ceil(rest) + ' s' : 'Zeit!'; el.classList.toggle('aus', rest <= 0); };
  takt(); if (d.tRun) hTakt = setInterval(takt, 250);
}
nav.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { ui.tab = t.dataset.tab; zeichnen(); return; }
  const s = e.target.closest('[data-screen]'); if (s && !s.disabled) { s.dataset.screen === 'mission' ? cmd('mission_start') : cmd('screen', { name: s.dataset.screen }); }
});

// ------------------------------------------------------------------ Zentrale
const STUFEN = { uebergabe: 'Übergabe', maulwurf: 'Maulwurf', ziel: 'Ziel der Zelle', hueter: 'Hüter des Archivs', bilanz: 'Bilanz', kartei: 'Beutekartei' };
function tageUebrig() { const st = S.story || {}, n = Math.max(1, S.plan.length); return S.cur < S.plan.length ? Math.ceil((st.tage || 7) * (n - S.cur) / n) : 0; }

function boxProlog() {
  const pr = S.extra.prolog || [], i = Math.min(S.prologIdx || 0, pr.length - 1), an = S.screen === 'prolog';
  if (!pr.length) return '';
  return `<div class="box ${an ? 'alarm' : ''}"><div class="reihe" style="justify-content:space-between"><span class="klein ${an ? 'signal' : ''}">Prolog · Tafel ${pad(i + 1)} / ${pad(pr.length)}</span>
      ${an ? '' : '<button class="btn klein" data-do="prologzeigen">Auf die Leinwand</button>'}</div>
    ${an ? `<p class="gross" style="font-size:22px">${esc(pr[i].titel)}</p><p class="text blass">${esc(pr[i].text)}</p>
      <div class="reihe"><button class="btn" data-do="prolog" data-d="-1" ${i ? '' : 'disabled'}>‹ Zurück</button><button class="btn rot" data-do="prolog" data-d="1" ${i < pr.length - 1 ? '' : 'disabled'}>Weiter ›</button>
      ${i === pr.length - 1 ? '<button class="btn hell" data-do="prologende">Zur Zentrale</button>' : ''}</div>` : ''}</div>`;
}

function boxFinale() {
  const stufen = S.extra.finaleStufen, i = Math.min(S.finaleStufe || 0, stufen.length - 1), art = stufen[i], mo = S.mole;
  let h = `<div class="box alarm"><div class="klein signal">Übergabe · ${pad(i + 1)} / ${pad(stufen.length)} · ${STUFEN[art]}</div>`;
  if (art === 'maulwurf') {
    const n = Object.keys(S.moleVotes).length;
    h += mo.result ? `<p class="gross">${esc(code(mo.id))} ist ${mo.result.caught ? 'enttarnt' : 'entkommen'}.</p>`
      : `<p class="text">${n} von ${S.agents.length} haben abgestimmt.</p><div class="reihe"><button class="btn" data-do="mvote" data-x="${mo.voteOpen ? 0 : 1}">${mo.voteOpen ? 'Abstimmung schließen' : 'Abstimmung öffnen'}</button>
         <button class="btn rot" data-do="mresolve" ${n ? '' : 'disabled'}>Maulwurf enthüllen</button></div><p class="kbd">Beim Enthüllen wird der Rucksack verteilt oder die Prämie ausgezahlt.</p>`;
  }
  h += `<div class="reihe"><button class="btn" data-do="fstufe" data-d="-1" ${i ? '' : 'disabled'}>‹ Zurück</button>
    <button class="btn rot" data-do="fstufe" data-d="1" ${i < stufen.length - 1 && !(art === 'maulwurf' && !mo.result) ? '' : 'disabled'}>Weiter ›</button></div></div>`;
  return h;
}

function boxRegeln() {
  const z = S.extra.ziel, zahl = (k, v, min, max, breite) => `<input class="feld kurz" style="width:${breite || 70}px" type="number" min="${min}" max="${max}" data-k="r-${k}" value="${v}" data-change="regel" data-f="${k}">`;
  return `<div class="box"><div class="klein">Regeln der Zelle</div>
    <div class="reihe"><span class="text">Umlagern:</span>${zahl('stealPct', S.stealPct, 0, 100)}<span class="blass">% vom fremden Rucksack, mindestens</span>${zahl('stealAmount', S.stealAmount, 0, 99)}<span class="blass">Wörter</span></div>
    <div class="reihe"><span class="text">Unterwegs beschädigt:</span>${zahl('stealVerlust', S.stealVerlust, 0, 100)}<span class="blass">% der umgelagerten Wörter gehen verloren</span></div>
    <div class="reihe"><span class="text">Verzicht:</span>${zahl('verzichtBonus', S.verzichtBonus, 0, 20)}<span class="blass">Wörter Dank der Zentrale</span></div>
    <div class="reihe"><span class="text">Ziel der Zelle:</span><span class="seg"><button class="${S.ziel < 0 ? 'an' : ''}" data-do="zielart" data-x="auto">Auto</button><button class="${S.ziel > 0 ? 'an' : ''}" data-do="zielart" data-x="fest">Fest</button><button class="${S.ziel === 0 ? 'an' : ''}" data-do="zielart" data-x="aus">Aus</button></span>
      ${S.ziel > 0 ? zahl('ziel', S.ziel, 1, 9999, 90) : ''}<span class="blass">${z.wert > 0 ? `${z.wert} Wörter${S.ziel < 0 ? ' (8 pro Person)' : ''} · jetzt ${z.stand}${S.mole.on ? ` · ohne Maulwurf ${z.ohneMaulwurf}` : ''}` : 'kein gemeinsames Ziel'}</span></div>
    <p class="kbd">Der Rucksack des Maulwurfs zählt bei der Übergabe nicht für das Ziel. Wer umlagert, vernichtet also Wörter der Zelle.</p></div>`;
}

function boxMaulwurf() {
  const mo = S.mole;
  let h = `<div class="box"><div class="reihe" style="justify-content:space-between"><span class="klein">Maulwurf</span>
    <span class="seg"><button class="${mo.on ? '' : 'an'}" data-do="mtoggle" data-x="0">Aus</button><button class="${mo.on ? 'an' : ''}" data-do="mtoggle" data-x="1">An</button></span></div>`;
  if (!mo.on) return h + `<p class="text blass">Eingeschaltet bekommt eine zufällige Person heimlich die Rolle Maulwurf. Alle Geräte zeigen eine verdeckte Rollenkarte im gleichen Format.</p></div>`;
  const t = S.extra.moleTally, n = Object.keys(S.moleVotes).length;
  h += `<div class="reihe"><span class="text">Maulwurf: <b>${ui.zeigMole ? esc(code(mo.id) + ' · ' + ((agent(mo.id) || {}).name || '')) : '●●●●●●'}</b></span>
      <button class="btn klein" data-do="mzeig">${ui.zeigMole ? 'Verbergen' : 'Anzeigen'}</button>${mo.result ? '' : '<button class="btn klein" data-do="mpick">Neu bestimmen</button>'}</div>
    <div class="reihe"><span class="klein">Prämie bei Entkommen</span><input class="feld kurz" type="number" min="0" data-k="mbonus" value="${mo.bonus}" data-change="mbonus"><span class="blass">Wörter</span></div>`;
  if (!mo.result) h += `<div class="reihe"><button class="btn ${mo.voteOpen ? 'rot' : ''}" data-do="mvote" data-x="${mo.voteOpen ? 0 : 1}">${mo.voteOpen ? 'Abstimmung schließen' : 'Abstimmung öffnen'}</button><span class="klein">${n} Stimmen${ui.zeigMole && n ? ' · ' + Object.entries(t).map(([k, v]) => esc(code(k)) + ' ' + v).join(', ') : ''}</span></div>
    <p class="kbd">Abstimmen geht jederzeit, die letzte Stimme zählt. Aufgelöst wird bei der Übergabe.</p>`;
  return h + '</div>';
}

function seiteZentrale() {
  const m = mission(), ps = S.pendingSteal, mi = m ? (((S.story || {}).missionen || {})[m.type] || {}) : {};
  let links = '';
  if (S.screen === 'finale') links += boxFinale();
  links += boxProlog();
  if (ps) {
    links += `<div class="box alarm"><div class="klein signal">Umlagern</div>`;
    if (!S.thief) links += `<p class="gross">Gleichstand an der Spitze. Wer darf umlagern?</p><div class="reihe">${ps.winners.filter(agent).map(id => `<button class="btn" data-do="dieb" data-id="${id}">${esc(code(id))}</button>`).join('')}</div>`;
    else links += `<p class="gross"><span class="display signal">${esc(code(S.thief))}</span> hat den Einsatz am besten erledigt und darf umlagern. Aus wessen Rucksack? <span class="blass">(genommen / angekommen)</span></p>
      <div class="reihe">${sorted().filter(a => a.id !== S.thief && total(a.id) > 0).map(a => { const v = (S.extra.umlagerVorschau || {})[a.id] || [0, 0];
        return `<button class="btn" data-do="opfer" data-id="${a.id}" title="nimmt ${v[0]}, davon kommen ${v[1]} an">${esc(a.code)} · ${total(a.id)} <span class="blass">(−${v[0]} / +${v[1]})</span></button>`; }).join('') || '<span class="blass">Alle Rucksäcke sind leer.</span>'}</div>`;
    links += `<button class="btn link" data-do="verzicht">Verzichtet${S.verzichtBonus ? ' (+' + S.verzichtBonus + ' Wörter)' : ''}</button></div>`;
  }
  if (S.lastSteal) links += `<p class="text" style="border-left:3px solid var(--signal);padding-left:12px">${esc(S.lastSteal)}</p>`;
  if (m) {
    const g = G(m.type);
    links += `<div class="box hell"><div class="reihe" style="justify-content:space-between"><span class="klein">Einsatz ${pad(S.cur + 1)} / ${pad(S.plan.length)} · ${esc(g.name)}</span><span class="klein">Noch ${tageUebrig()} Tage · ${modusLabel(m)}</span></div>
      <h1>${esc(mi.ort || g.name)}</h1>${mi.lage ? `<p class="text" style="font-style:italic">${esc(mi.lage)}</p>` : ''}${regeln(g)}
      ${S.agents.length ? '' : '<p class="text" style="color:#a42a1a">Noch keine Agenten. Sie treten über die Leinwand bei oder werden unter „Agenten“ angelegt.</p>'}
      <div class="reihe"><button class="btn" style="background:var(--nacht);color:var(--papier);border-color:var(--nacht)" data-do="missionStart">${S.active ? 'Einsatz fortsetzen' : 'Einsatz starten'}</button>
      <span class="klein">Die Leinwand wechselt mit.</span></div></div>`;
  } else if (S.plan.length && S.screen !== 'finale') {
    links += `<div class="box hell"><div class="klein">Alle Einsätze abgeschlossen</div><h1>Die Übergabe</h1><button class="btn rot" data-do="finale">Übergabe auf der Leinwand beginnen</button></div>`;
  }
  links += boxRegeln();
  links += boxMaulwurf();
  const fortschritt = S.plan.map((p, i) => `<span class="pill ${i === S.cur ? 'an' : ''}" style="${i < S.cur ? 'opacity:.45' : ''}">${pad(i + 1)} ${esc(((S.story || {}).missionen || {})[p.type]?.ort || G(p.type).name)}</span>`).join(' ');
  const stat = S.extra.statistik;
  return `<div class="raster"><div class="stapel">${links}</div>
    <div class="stapel"><div class="klein">Rucksäcke · ${S.agents.length} Agenten</div>
    <div class="rang">${sorted().map((a, i) => { const pr = stat.pro[a.id] || {};
      return `<div><span class="blass">${pad(i + 1)}</span><b>${esc(a.code)}<small>${esc(a.name)}${pr.genommen || pr.verloren ? ' · +' + pr.genommen + ' / −' + pr.verloren + ' umgelagert' : ''}</small></b><span class="display" style="font-size:22px">${total(a.id)}</span></div>`; }).join('') || '<p class="blass">Noch leer.</p>'}</div>
    <div class="klein">Ablauf</div><div class="reihe">${fortschritt}</div></div></div>`;
}

// ------------------------------------------------------------------ Agenten
function seiteAgenten() {
  const rows = S.agents.map(a => `<div class="zeile">
      <div class="wer"><b>${esc(a.code)}</b><span>${total(a.id)} Wörter</span></div>
      <div class="mitte"><input class="feld mittel" data-k="n-${a.id}" value="${esc(a.name)}" data-change="rename" data-id="${a.id}">
        <button class="btn klein" data-do="link" data-id="${a.id}" title="Persönlicher Link: meldet das Gerät ohne Namenseingabe an">Geräte-Link kopieren</button></div>
      <div class="aktion"><button class="btn klein" data-do="score" data-id="${a.id}" data-d="-1">−</button><button class="btn klein" data-do="score" data-id="${a.id}" data-d="1">+</button>
        <button class="btn klein" data-do="reroll" data-id="${a.id}" title="Neuen Decknamen ziehen">↻</button><button class="btn klein" data-do="del" data-id="${a.id}" title="Entfernen">✕</button></div></div>`).join('');
  return `<div class="raster"><div class="stapel">
    <h2>Agenten</h2>
    <p class="text">Mitspielende treten selbst bei: QR-Code auf der Leinwand scannen oder ${esc(basis())} öffnen. Wer kein Gerät hat, wird hier angelegt – die Moderation trägt dann im Cockpit für diese Person ein.</p>
    <div class="reihe"><input class="feld" style="flex:1" data-k="neu" id="neuName" placeholder="Name" maxlength="40"><button class="btn rot" data-do="add">Anlegen</button></div>
    <div class="reihe"><button class="btn ${S.joinOpen ? '' : 'rot'}" data-do="join">${S.joinOpen ? 'Beitritt sperren' : 'Beitritt öffnen'}</button>
      <span class="klein">${S.joinOpen ? 'Beitritt offen' : 'Beitritt gesperrt – nur noch per Geräte-Link'}</span></div>
    <div class="tabelle">${rows || '<p class="blass">Noch niemand da.</p>'}</div></div>
    <div class="stapel"><h2>Abend</h2>
      <p class="text">Neu starten setzt Punkte und Fortschritt zurück, die Agenten bleiben. „Alle entfernen“ leert die Liste für eine neue Runde mit anderen Leuten.</p>
      <div class="reihe"><button class="btn" data-do="reset">Abend neu starten</button><button class="btn" data-do="clear">Alle Agenten entfernen</button></div></div></div>`;
}

// ------------------------------------------------------------------ Einsatzplan
function seitePlan() {
  const mins = S.plan.reduce((acc, p) => acc + G(p.type).min * (G(p.type).ext || G(p.type).board ? 1 : p.rounds) + 3, 0);
  const rows = S.plan.map((p, i) => {
    const g = G(p.type), team = p.mode === 'team';
    return `<div class="p ${i === S.cur ? 'jetzt' : ''}" style="${i < S.cur ? 'opacity:.5' : ''}">
      <span class="blass">${pad(i + 1)}</span>
      <div><b>${esc(g.name)}</b><div class="klein">${i < S.cur ? 'erledigt' : '≈ ' + Math.round(g.min * (g.ext || g.board ? 1 : p.rounds)) + ' Min.'}</div></div>
      ${p.type === 'deppardy' ? `<select class="feld kurz" style="width:180px" data-change="popt" data-i="${i}" data-k="po-${p.id}">${S.boards.map(b => `<option value="${esc(b.id)}" ${p.opt === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>`
        : p.type === 'atlas' ? `<select class="feld kurz" style="width:180px" data-change="popt" data-i="${i}" data-k="po-${p.id}"><option value="">Alle Sets gemischt</option>${Object.entries(S.atlasSets).map(([k, v]) => `<option value="${esc(k)}" ${p.opt === k ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>` : ''}
      <span class="seg"><button class="${team ? '' : 'an'}" data-do="pmode" data-i="${i}" data-x="solo">Einzeln</button><button class="${team ? 'an' : ''}" data-do="pmode" data-i="${i}" data-x="team">Zellen</button></span>
      <label class="klein">Runden <input class="feld kurz" style="width:64px" type="number" min="1" data-k="pr-${p.id}" value="${p.rounds}" data-change="prounds" data-i="${i}" ${g.ext || g.board ? 'disabled' : ''}></label>
      <label class="klein">${g.kurs ? 'Punkte / Wort' : 'Wörter'} <input class="feld kurz" style="width:${g.kurs ? 76 : 64}px" type="number" min="${g.kurs ? 1 : 0}" data-k="pp-${p.id}" value="${p.pts}" data-change="ppts" data-i="${i}" title="${g.kurs ? 'Umrechnungskurs: so viele Punkte ergeben ein Wort' : 'Wörter pro Treffer'}"></label>
      <span class="reihe"><button class="btn klein" data-do="pmove" data-i="${i}" data-d="-1">↑</button><button class="btn klein" data-do="pmove" data-i="${i}" data-d="1">↓</button><button class="btn klein" data-do="pdel" data-i="${i}">✕</button></span></div>`;
  }).join('');
  return `<div class="stapel"><div class="reihe" style="justify-content:space-between"><h2>Einsatzplan</h2><span class="klein">${S.plan.length} Missionen · ≈ ${Math.floor(mins / 60)} h ${pad(Math.round(mins % 60))} min</span></div>
    <div class="plan">${rows}</div>
    <div class="klein">Mission anhängen</div><div class="katalog">${Object.keys(M.games).map(k => `<button class="btn klein" data-do="padd" data-x="${k}">+ ${esc(G(k).name)}</button>`).join('')}</div>
    <div><button class="btn link" data-do="preset">Plan auf Standard zurücksetzen</button></div></div>`;
}
function planSenden(plan, cur) { S.plan = plan; if (cur != null) S.cur = cur; cmd('plan_set', { plan, cur: cur ?? S.cur }); }

// ------------------------------------------------------------------ Archiv
function seiteArchiv() {
  const t = ui.archiv, list = S.content[t] || [];
  const tabs = `<button class="${t === 'drehbuch' ? 'an' : ''}" data-do="atab" data-x="drehbuch">Drehbuch</button><button class="${t === 'kartei' ? 'an' : ''}" data-do="atab" data-x="kartei">Beutekartei <span class="blass">${beuteWoerter().filter(x => !(S.kartei || {})[x.wort]).length || ''}</span></button>` + M.internal.concat(M.special).map(k => `<button class="${k === t ? 'an' : ''}" data-do="atab" data-x="${k}">${esc(G(k).name)} <span class="blass">${k === 'deppardy' ? S.boards.length : k === 'atlas' ? Object.keys(S.atlasSets).length : (S.content[k] || []).length}</span></button>`).join('');
  if (t === 'drehbuch') return archivKopf(tabs) + archivDrehbuch();
  if (t === 'kartei') return archivKopf(tabs) + archivKartei();
  if (t === 'deppardy') return archivKopf(tabs) + archivDeppardy();
  if (t === 'atlas') return archivKopf(tabs) + archivAtlas();
  const eintraege = list.map((e, i) => `<div class="eintrag"><span class="blass">${pad(i + 1)}</span><div class="felder">${M.fields[t].map(([key, label, kind]) => {
      const v = e[key] || '', k = `c-${t}-${i}-${key}`;
      if (kind === 'area') return `<label class="breit">${esc(label)}<textarea class="feld" data-k="${k}" data-change="content" data-i="${i}" data-f="${key}">${esc(v)}</textarea></label>`;
      if (kind === 'img' || kind === 'audio') return `<label class="breit">${esc(label)}<div class="reihe"><input class="feld" style="flex:1" data-k="${k}" value="${esc(v)}" data-change="content" data-i="${i}" data-f="${key}" placeholder="URL oder Datei hochladen">
          <input type="file" accept="${kind === 'img' ? 'image/*' : 'audio/*'}" data-upload data-i="${i}" data-f="${key}"></div>
          ${v && kind === 'img' ? `<img src="${esc(v)}" alt="">` : ''}${v && kind === 'audio' && !/youtu\.?be/.test(v) ? `<audio controls preload="none" src="${esc(v)}"></audio>` : ''}</label>`;
      return `<label class="${kind === 'wide' ? 'breit' : ''}">${esc(label)}<input class="feld" data-k="${k}" value="${esc(v)}" data-change="content" data-i="${i}" data-f="${key}"></label>`;
    }).join('')}</div><button class="btn link" data-do="cdel" data-i="${i}">Löschen</button></div>`).join('');
  return `<div class="stapel"><div class="klein">Beweismittel · Deppardy &amp; Atlas pflegen ihre Inhalte selbst</div><h1>Archiv</h1>
    <div class="untertabs">${tabs}</div><p class="text blass">${esc(M.hints[t])} Änderungen werden beim Verlassen des Feldes gespeichert.</p>
    ${(() => { const r = (S.extra.reihenfolge || {})[t]; return r && r.von ? `<div class="reihe"><span class="klein">Als Nächstes kommt Eintrag ${pad(r.naechster)} von ${pad(r.von)}${r.gespielt >= r.von ? ' – alle schon einmal gespielt' : ''}</span>
      <button class="btn klein" data-do="cursorweg" data-x="${t}" ${r.gespielt ? '' : 'disabled'}>Wieder von vorn</button></div>` : ''; })()}
    ${eintraege || '<p class="blass">Noch keine Einträge.</p>'}
    <div class="reihe"><button class="btn rot" data-do="cadd">Eintrag hinzufügen</button><button class="btn" data-do="crestore">Beispiele wiederherstellen</button></div></div>`;
}
// Alle Beutewörter, die irgendwo im Archiv stehen – mit Fundstelle
function beuteWoerter() {
  const out = [], dazu = (wort, wo) => { wort = String(wort || '').trim(); if (wort && !out.some(x => x.wort === wort)) out.push({ wort, wo }); };
  Object.entries(S.content || {}).forEach(([t, l]) => (l || []).forEach(e => dazu(e.beute, G(t).name)));
  (S.boards || []).forEach(b => (b.cats || []).forEach(c => Object.values(c.bw || {}).forEach(w => dazu(w, 'Deppardy · ' + c.name))));
  Object.values(S.atlasSets || {}).forEach(st => (st.eintraege || []).forEach(e => dazu(e.beute, 'Atlas · ' + st.name)));
  return out;
}
function archivKartei() {
  const K = S.kartei || {}, alle = beuteWoerter(), such = (ui.ksuche || '').toLowerCase();
  Object.keys(K).forEach(w => { if (!alle.some(x => x.wort === w)) alle.push({ wort: w, wo: 'nirgends verwendet' }); });
  const fehlen = alle.filter(x => !K[x.wort]);
  const liste = alle.filter(x => !such || x.wort.toLowerCase().includes(such) || x.wo.toLowerCase().includes(such))
    .sort((a, b) => (!!K[a.wort] - !!K[b.wort]) || a.wort.localeCompare(b.wort, 'de'));
  const w = ui.kartei && alle.some(x => x.wort === ui.kartei) ? ui.kartei : (liste[0] || {}).wort;
  const k = K[w] || {}, wo = (alle.find(x => x.wort === w) || {}).wo;
  const opt = Object.entries(WWH.VERMERK);
  return `<div class="raster" style="margin-top:18px"><div class="stapel">
      <p class="text blass">Jedes Beutewort bekommt beim Bergen eine Karteikarte auf Leinwand und Handy. Hier stehen die Einträge. ${fehlen.length ? `<span class="signal">${fehlen.length} Wörter haben noch keine Karte.</span>` : 'Alle Wörter haben eine Karte.'}</p>
      <div class="reihe"><input class="feld" style="flex:1" data-k="ksuche" id="ksuche" placeholder="Suchen …" value="${esc(ui.ksuche || '')}"><button class="btn link" data-do="krestore">Mitgelieferte Karten wiederherstellen</button></div>
      <div style="max-height:62vh;overflow:auto;border:1px solid var(--kante)">${liste.map(x => `<button data-do="kzeig" data-x="${esc(x.wort)}" style="display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:${x.wort === w ? 'var(--nacht-3)' : 'transparent'};border:none;border-bottom:1px solid var(--kante);padding:8px 12px;cursor:pointer">
          <span class="serif" style="font-size:17px">${K[x.wort] ? '' : '<span class="signal">● </span>'}${esc(x.wort)}</span><span class="klein">${esc(x.wo)}</span></button>`).join('')}</div></div>
    <div class="stapel">${w ? `${WWH.karte({ ...k, wort: w, ort: wo })}
      <label class="klein" style="display:flex;flex-direction:column;gap:4px">Artikel oder Wortart<input class="feld" data-k="k-art" data-kf="art" data-w="${esc(w)}" value="${esc(k.art || '')}" placeholder="der / die / das / Adj. / Verb …"></label>
      <label class="klein" style="display:flex;flex-direction:column;gap:4px">Bedeutung<textarea class="feld" data-k="k-def" data-kf="def" data-w="${esc(w)}" style="min-height:80px">${esc(k.def || '')}</textarea></label>
      <label class="klein" style="display:flex;flex-direction:column;gap:4px">Herkunft (optional)<input class="feld" data-k="k-her" data-kf="herkunft" data-w="${esc(w)}" value="${esc(k.herkunft || '')}"></label>
      <label class="klein" style="display:flex;flex-direction:column;gap:4px">Vermerk des Amtes<select class="feld" data-kf="vermerk" data-w="${esc(w)}"><option value="">—</option>${opt.map(([key, lbl]) => `<option value="${key}" ${k.vermerk === key ? 'selected' : ''}>${lbl}</option>`).join('')}</select></label>
      ${K[w] ? `<div><button class="btn link" data-do="kdel" data-x="${esc(w)}">Karte löschen</button></div>` : ''}` : '<p class="blass">Noch keine Beutewörter im Archiv.</p>'}</div></div>`;
}

function archivDrehbuch() {
  const st = S.story || {}, F = st.finale || {}, MW = st.maulwurf || {}, MS = st.missionen || {};
  const feld = (label, sf, v, area) => `<label class="klein" style="display:flex;flex-direction:column;gap:4px">${label}${area
    ? `<textarea class="feld" data-k="d-${sf}" data-df="${sf}" style="min-height:80px">${esc(v || '')}</textarea>` : `<input class="feld" data-k="d-${sf}" data-df="${sf}" value="${esc(v || '')}">`}</label>`;
  return `<div class="stapel" style="margin-top:18px">
    <p class="text blass">Alle Texte der Geschichte. Änderungen werden beim Verlassen des Feldes gespeichert. Platzhalter: <code>{bonus}</code> und <code>{anteil}</code> in den Maulwurf-Texten, <code>{ziel}</code> und <code>{stand}</code> in den Ziel-Texten.</p>
    <div class="raster"><div class="stapel"><h2>Grundlage</h2>
      <div class="reihe">${feld('Name der Zelle', 'zelle', st.zelle)}${feld('Tage bis zur Säuberung', 'tage', st.tage)}</div>
      ${feld('Auftrag (steht auf jeder Einsatzkarte)', 'auftrag', st.auftrag)}
      <h2>Prolog</h2>
      ${(st.prolog || []).map((p, i) => `<div class="box"><div class="reihe" style="justify-content:space-between"><span class="klein">Tafel ${pad(i + 1)}</span><button class="btn klein" data-do="dpdel" data-i="${i}">✕</button></div>
        ${feld('Titel', 'prolog:' + i + ':titel', p.titel)}${feld('Text', 'prolog:' + i + ':text', p.text, true)}
        <div class="reihe"><label class="klein" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-pm="${i}" ${p.maulwurf ? 'checked' : ''}> nur mit Maulwurf</label>
          <label class="klein" style="display:flex;gap:8px;align-items:center">Schattenmotiv <select class="feld kurz" style="width:190px" data-df="prolog:${i}:motiv">${[['', 'automatisch'], ['jalousie', 'Licht durch Jalousie'], ['akten', 'Aktenstapel, Verbot'], ['uhr', 'Uhr vor zwölf, Feuer'], ['semikolon', 'Semikolon'], ['rucksack', 'Rucksack'], ['verdacht', 'Gestalt im Türlicht']].map(([k, l]) => `<option value="${k}" ${(p.motiv || '') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div></div>`).join('')}
      <div><button class="btn" data-do="dpadd">Tafel hinzufügen</button></div></div>
    <div class="stapel"><h2>Einsatzbefehle</h2>
      ${Object.keys(M.games).map(k => `<div class="box"><div class="klein">${esc(G(k).name)}</div>${feld('Einsatzort', 'mission:' + k + ':ort', (MS[k] || {}).ort)}${feld('Lage', 'mission:' + k + ':lage', (MS[k] || {}).lage, true)}${feld('Funkspruch danach', 'mission:' + k + ':nach', (MS[k] || {}).nach, true)}</div>`).join('')}
      <h2>Übergabe</h2>
      ${feld('Einleitung', 'finale:uebergabe', F.uebergabe, true)}${feld('Titel für Platz 1', 'finale:hueter', F.hueter)}
      ${feld('Frage der Bilanz', 'finale:frage', F.frage)}${feld('Wenn nie umgelagert wurde', 'finale:keine', F.keine, true)}
      ${feld('Ziel ansagen ({ziel})', 'finale:ziel', F.ziel, true)}${feld('Ziel erreicht ({stand}, {ziel})', 'finale:zielErreicht', F.zielErreicht, true)}
      ${feld('Ziel verfehlt ({stand}, {ziel})', 'finale:zielVerfehlt', F.zielVerfehlt, true)}${feld('Hinweis: Maulwurf zählt nicht', 'finale:maulwurfZaehlt', F.maulwurfZaehlt, true)}
      ${feld('Überschrift der Beutewörter', 'finale:gerettet', F.gerettet)}
      <h2>Maulwurf</h2>
      ${feld('Rollenkarte des Maulwurfs', 'maulwurf:rolle', MW.rolle, true)}${feld('Rollenkarte der Zelle', 'maulwurf:zelle', MW.zelle, true)}
      ${feld('Frage bei der Abstimmung', 'maulwurf:frage', MW.frage)}${feld('Text bei Enttarnung', 'maulwurf:enttarnt', MW.enttarnt, true)}${feld('Text bei Entkommen', 'maulwurf:entkommen', MW.entkommen, true)}</div></div>
    <div><button class="btn link" data-do="drestore">Drehbuch auf die Vorlage zurücksetzen</button></div></div>`;
}
function drehbuchFeld(df, v) {
  const st = structuredClone(S.story || {}), [a, b, c] = df.split(':');
  if (a === 'tage') st.tage = parseInt(v) || 7;
  else if (!b) st[a] = v;
  else if (a === 'prolog') st.prolog[+b][c] = v;
  else if (a === 'mission') { st.missionen = st.missionen || {}; st.missionen[b] = { ...(st.missionen[b] || {}), [c]: v }; }
  else { st[a] = { ...(st[a] || {}), [b]: v }; }
  drehbuchSenden(st);
}
function drehbuchSenden(st) { S.story = st; cmd('story_set', { story: st }); }

function archivKopf(tabs) { return `<div class="stapel"><div class="klein">Beweismittel</div><h1>Archiv</h1><div class="untertabs">${tabs}</div></div>`; }

// ---- Deppardy-Boards
function archivDeppardy() {
  if (ui.boardId && !S.boards.some(b => b.id === ui.boardId) && !ui.boardDirty) ui.boardId = null;
  if (!ui.boardId && S.boards[0]) ui.boardId = S.boards[0].id;
  const orig = S.boards.find(b => b.id === ui.boardId);
  if (!ui.boardDirty || !ui.board || ui.board.id !== ui.boardId) ui.board = orig ? structuredClone(orig) : null;
  const liste = S.boards.map(b => `<button class="btn klein ${b.id === ui.boardId ? 'hell' : ''}" data-do="bwahl" data-id="${esc(b.id)}">${esc(b.name)}</button>`).join('');
  let h = `<div class="stapel" style="margin-top:18px">

        <span class="klein">${b.pts.filter(p => c.qh[p]).length} / ${b.pts.length} Fragen</span></summary>

          <label>Tipp<textarea class="feld" data-k="bh-${ci}-${p}" data-bf="hh:${ci}:${p}">${esc(c.hh[p] || '')}</textarea></label>

}
function boardFeld(bf, el) {
  const b = ui.board, [art, ci, p] = bf.split(':');
  if (art === 'name') b.name = el.value;
  else if (art === 'pts') { const neu = [...new Set(el.value.split(/[,; ]+/).map(x => parseInt(x)).filter(x => x > 0))].sort((a, z) => a - z); if (neu.length) b.pts = neu; }
  else if (art === 'cat') b.cats[+ci].name = el.value;
  else if (art === 'rk') { if (el.checked) b.cats[+ci].rk[p] = true; else delete b.cats[+ci].rk[p]; }
  else { b.cats[+ci][art] = b.cats[+ci][art] || {}; if (el.value.trim()) b.cats[+ci][art][p] = el.value; else delete b.cats[+ci][art][p]; }
  if (!ui.boardDirty) { ui.boardDirty = true; const btn = app.querySelector('[data-do="bsave"]'); if (btn) { btn.textContent = 'Änderungen speichern'; btn.classList.add('rot'); } }
}
async function boardSpeichern() { if (!ui.board) return; await cmd('board_save', { board: ui.board }); ui.boardDirty = false; hinweis('Board gespeichert'); }

// ---- Atlas-Sets
function archivAtlas() {
  const ids = Object.keys(S.atlasSets);

  const set = ui.setId ? S.atlasSets[ui.setId] : null;
  let h = `<datalist id="laender">${Object.entries(GEO).filter(([, v]) => !v.kein).sort((a, b) => a[1].name.localeCompare(b[1].name, 'de')).map(([, v]) => `<option value="${esc(v.name)}">`).join('')}</datalist>
    <div class="stapel" style="margin-top:18px"><p class="text blass">Jede Atlas-Mission zieht ihre Begriffe aus einem Set – welches, steht im Einsatzplan. Länder per Namen eintragen; „auch richtig“ nimmt mehrere Länder mit Komma.</p>
    <div class="reihe">${ids.map(k => `<button class="btn klein ${k === ui.setId ? 'hell' : ''}" data-do="swahl" data-id="${esc(k)}">${esc(S.atlasSets[k].name)} · ${S.atlasSets[k].eintraege.length}</button>`).join('')}</div>
    <div class="reihe"><button class="btn rot" data-do="sneu">Neues Set</button><button class="btn" data-do="sdel" ${set ? '' : 'disabled'}>Set löschen</button><button class="btn link" data-do="srestore">Mitgelieferte Sets wiederherstellen</button></div></div>`;
  if (!set) return h;
  h += `<div class="stapel" style="margin-top:18px"><div class="reihe"><input class="feld" style="flex:1;font-size:20px" data-k="sname" data-sf="name" value="${esc(set.name)}">
      <input class="feld" style="flex:2" data-k="smarke" data-sf="marke" value="${esc(set.marke)}" placeholder="Leitfrage, z. B. Woher stammt dieses Gericht?"></div>
    <div class="aeintrag klein"><span>Begriff</span><span>Land</span><span>Auch richtig</span><span>Notiz nach der Auflösung</span><span>Beutewort</span><span></span></div>
    ${set.eintraege.map((e, i) => `<div class="aeintrag">
      <input class="feld" data-k="se-${i}-t" data-sf="e:${i}:text" value="${esc(e.text)}">
      <input class="feld ${e.land ? '' : 'fehl'}" list="laender" data-k="se-${i}-l" data-sf="e:${i}:land" value="${esc(landName(e.land))}">
      <input class="feld" data-k="se-${i}-a" data-sf="e:${i}:auchOk" value="${esc(e.auchOk.map(landName).join(', '))}">
      <input class="feld" data-k="se-${i}-n" data-sf="e:${i}:notiz" value="${esc(e.notiz)}">
      <input class="feld ${e.beute && !(S.kartei || {})[e.beute] ? 'fehl' : ''}" data-k="se-${i}-b" data-sf="e:${i}:beute" value="${esc(e.beute || '')}" title="${e.beute && !(S.kartei || {})[e.beute] ? 'Noch keine Karteikarte' : ''}">
      <button class="btn klein" data-do="sedel" data-i="${i}">✕</button></div>`).join('')}
    <div><button class="btn" data-do="seadd">Begriff hinzufügen</button></div></div>`;
  return h;
}
function setSenden(set) { S.atlasSets[ui.setId] = set; cmd('atlas_set_save', { id: ui.setId, set }); }
function setFeld(sf, v) {
  const set = structuredClone(S.atlasSets[ui.setId]), [art, i, f] = sf.split(':');
  const key = n => NAME2KEY[String(n).trim().toLowerCase()] || '';
  if (art === 'name' || art === 'marke') set[art] = v;
  else if (f === 'land') { set.eintraege[+i].land = key(v); if (v && !key(v)) hinweis('Land „' + v + '“ nicht gefunden – bitte aus der Liste wählen'); }
  else if (f === 'auchOk') { const teile = v.split(',').map(x => x.trim()).filter(Boolean); set.eintraege[+i].auchOk = teile.map(key).filter(Boolean); const fehlt = teile.filter(x => !key(x)); if (fehlt.length) hinweis('Nicht gefunden: ' + fehlt.join(', ')); }
  else set.eintraege[+i][f] = v;
  setSenden(set);
}

function contentSenden(list) { S.content[ui.archiv] = list; cmd('content_set', { type: ui.archiv, list }); }

// ------------------------------------------------------------------ System
function seiteSystem() {

    <div class="box"><div class="klein">Agenten-Geräte (steht als QR-Code auf der Leinwand)</div><div class="link">${esc(basis())}</div>
      <div class="klein">Leinwand</div><div class="link">${esc(basis())}leinwand</div>
      <div class="klein">Steuermodul</div><div class="link">${esc(basis())}leitung/</div></div>
    <p class="text">Die Beitritts-Adresse ermittelt der Server selbst (${esc(LAN)}). Läuft der Abend über einen Tunnel oder eine Domain, hier die öffentliche Adresse eintragen.</p>
    <div class="reihe"><input class="feld" style="flex:1" data-k="joinurl" id="joinUrl" value="${esc(S.joinUrl)}" placeholder="${esc(LAN)}"><button class="btn" data-do="joinurl">Speichern</button></div></div>
    <div class="stapel"><h2>Spielstand</h2>
      <p class="text">Der Server speichert nach jeder Aktion in data/state.json. Für einen zweiten Abend oder als Sicherung lässt sich der ganze Stand samt Archiv und Plan exportieren.</p>

      <h2>Reihenfolge der Inhalte</h2>
      <p class="text blass">Jedes Spiel merkt sich, welcher Eintrag als Nächstes kommt – auch über einen Abend hinaus, damit beim zweiten Abend neue Fragen drankommen. Vor einem ganz neuen Abend mit denselben Leuten also nicht zurücksetzen.</p>
      <div><button class="btn" data-do="cursorallesweg">Alle Spiele wieder von vorn</button></div>
      <h2>Deppardy und Atlas</h2>
