}

// ------------------------------------------------------------------ Mission (Cockpit)
function seiteMission() {
  const m = mission();
  if (!S.active || !m) return `<div class="stapel"><h2>Keine Mission aktiv</h2><p class="text">Eine Mission startet in der Zentrale.</p><div><button class="btn rot" data-do="missionStart" ${m && S.agents.length ? '' : 'disabled'}>${m ? 'Mission ' + pad(S.cur + 1) + ' starten: ' + esc(G(m.type).name) : 'Plan ist durch'}</button></div></div>`;
  const g = G(m.type), step = m.pts || 1;
  const kopf = `<div class="reihe" style="justify-content:space-between"><span class="klein">Mission ${pad(S.cur + 1)} / ${pad(S.plan.length)} · ${modusLabel(m)}</span>
    <span class="reihe">${S.phase === 'play' ? `<span class="klein">Runde ${S.round + 1} / ${m.rounds}</span>` : ''}<button class="btn klein" data-do="abbruch">Abbrechen</button><button class="btn klein ${S.revealed && S.round >= m.rounds - 1 ? 'hell' : ''}" data-do="fertig">Mission abschließen</button></span></div>
    <h1>${esc(g.name)}</h1>`;

  if (S.phase === 'intro') {
    const zellen = m.mode === 'team' ? `<div class="box"><div class="reihe" style="justify-content:space-between"><span class="klein">Zellen</span>
      <span class="reihe"><span class="seg">${[2, 3, 4].map(n => `<button class="${S.teamCount === n ? 'an' : ''}" data-do="tcount" data-x="${n}">${n}</button>`).join('')}</span><button class="btn klein" data-do="treroll">Neu würfeln</button></span></div>${zellenKarten()}</div>` : '';
    return `<div class="raster cockpit"><div class="stapel">${kopf}${regeln(g)}${zellen}
      <div><button class="btn rot" data-do="beginnen" data-ext="${g.ext || ''}">${g.ext ? g.name + ' öffnen und starten' : 'Einsatz beginnen'}</button></div></div>
      <div class="stapel"><p class="text blass">Die Leinwand zeigt gerade Regeln${m.mode === 'team' ? ' und Zellen' : ''}. Die Geräte zeigen dasselbe, bei Zellen zusätzlich die eigene.</p></div></div>`;
  }

  if (m.type === 'deppardy' && S.dep) return `<div class="raster cockpit"><div class="stapel">${kopf}${cockpitDeppardy()}</div><div class="stapel">${punkteWertung()}</div></div>`;
  // play
  const it = S.rnd.item;
  if (m.type === 'atlas' && it) return `<div class="raster cockpit"><div class="stapel">${kopf}${cockpitAtlas(it)}${steuerung(m, it)}</div><div class="stapel">${punkteWertung()}</div></div>`;
  if (!it) return `<div class="stapel">${kopf}<p class="text">Im Archiv gibt es für ${esc(g.name)} keine Einträge. Dort anlegen oder die Mission abschließen.</p></div>`;
  return `<div class="raster cockpit"><div class="stapel">${kopf}${bühne(m, it, step)}</div><div class="stapel">${wertung(m, step)}</div></div>`;
}

function punkteWertung() {
  const u = (S.extra.units || []);
  return `<div class="reihe" style="justify-content:space-between"><span class="klein">Punkte dieser Mission</span><span class="klein">${mission() && G(mission().type).kurs ? mission().pts : 100} Punkte = 1 Wort</span></div>
    <div class="tabelle">${u.map(x => `<div class="zeile"><div class="wer"><b>${esc(x.label)}</b><span>${x.key.startsWith('t') ? x.members.map(code).map(esc).join(' · ') : esc((agent(x.key) || {}).name || '')}</span></div>
      <div class="mitte"><span class="display" style="font-size:24px">${S.upts[x.key] || 0}</span><span class="blass">= ${fmtGain(S.gains[x.members[0]]) || '0'} Wörter</span></div>
      <div class="aktion"><button class="btn klein" data-do="uadj" data-k="${x.key}" data-d="-100">−100</button><button class="btn klein" data-do="uadj" data-k="${x.key}" data-d="100">+100</button></div></div>`).join('')}</div>`;
}

function cockpitDeppardy() {
  const d = S.dep, b = d.board, c = d.cell, lbl = Object.fromEntries((S.extra.units || []).map(u => [u.key, u.label]));
  if (!c) {
    return `<div class="brett" style="grid-template-columns:repeat(${b.cats.length},1fr)">${b.cats.map(k => `<div class="kat">${esc(k.name)}</div>`).join('')}
      ${b.pts.map(p => b.cats.map((k, i) => { const key = i + '|' + p, weg = d.revealed[key], leer = !k.qh[p];
        return `<button class="${weg ? 'weg' : ''} ${leer ? 'leer' : ''}" data-do="${weg ? 'dreopen' : 'dopen'}" data-c="${i}" data-p="${p}" ${leer ? 'disabled' : ''} title="${weg ? 'Schon gespielt – Klick öffnet es wieder' : esc((k.qh[p] || '').replace(/<[^>]+>/g, ''))}">${p}${k.rk[p] ? '<span class="rk">×2</span>' : ''}</button>`; }).join('')).join('')}</div>
      <div class="reihe"><span class="klein">Buzzer</span><span class="seg"><button class="${S.depArm ? 'an' : ''}" data-do="deparm" data-x="1">nach Freigabe</button><button class="${S.depArm ? '' : 'an'}" data-do="deparm" data-x="0">sofort scharf</button></span>
        <span class="klein">Mit Freigabe startet der Timer erst beim Freigeben.</span></div>
      <div class="reihe"><span class="klein">Timer je Frage</span><input class="feld kurz" type="number" min="0" max="600" data-k="ddur" value="${d.dur}" data-change="ddur"><span class="blass">Sekunden, 0 = aus</span></div>
      <p class="kbd">Feld anklicken zum Aufdecken. In der Frage: <kbd>B</kbd> Buzzer freigeben · <kbd>Leertaste</kbd> weiter · <kbd>T</kbd> Timer · <kbd>R</kbd> richtig · <kbd>F</kbd> falsch · <kbd>Esc</kbd> schließen</p>`;
  }
  const cat = b.cats[c.c], v = S.extra.depValue, p = c.p;
  const erster = d.buzz.find(x => !d.wrong.includes(x.key));
  const naechster = d.stage < 2 ? (d.stage === 0 && (cat.hh[p] || '').trim() ? 'Tipp zeigen' : 'Antwort zeigen') : 'Feld schließen';
  return `<div class="depfeld"><div class="reihe" style="justify-content:space-between"><span class="klein">${esc(cat.name)} · ${p}${cat.rk[p] ? ' · Risiko ×2' : ''}</span><span class="display signal" style="font-size:34px">${v}</span></div>
      <div class="html">${cat.qh[p] || ''}</div>
      ${cat.hh[p] ? `<div class="text blass" style="${d.stage >= 1 ? 'color:var(--papier)' : ''}">Tipp${d.stage >= 1 ? ' (sichtbar)' : ''}: ${cat.hh[p]}</div>` : ''}
      <div class="antwort html">${cat.ah[p] || '–'}</div>
      <div class="reihe">${!d.armed && d.stage < 2 ? '<button class="btn hell" data-do="darm">Buzzer freigeben</button>' : ''}<button class="btn ${d.armed || d.stage >= 2 ? 'rot' : ''}" data-do="dstage">${naechster}</button>
        ${d.dur > 0 && d.stage < 2 ? `<button class="btn" data-do="dtimer">${d.tRun ? 'Timer anhalten' : 'Timer starten'}</button><span class="uhrtext" id="huhr"></span>` : ''}
        ${d.stage >= 2 ? '' : '<button class="btn link" data-do="dclose">ohne Auflösung schließen</button>'}</div></div>
    <div class="box"><div class="reihe" style="justify-content:space-between"><span class="klein">Buzzer</span><button class="btn klein" data-do="dbuzzreset">Buzzer neu freigeben</button></div>
      <div class="buzzliste">${d.buzz.map((x, i) => { const falsch = d.wrong.includes(x.key), dran = erster && erster.key === x.key;
        return `<div class="${dran ? 'dran' : ''}" style="${falsch ? 'opacity:.4' : ''}"><span class="blass">${i + 1}.</span><b>${esc(lbl[x.key] || '?')}</b>${x.key.startsWith('t') ? `<span class="blass">${esc(code(x.id))}</span>` : ''}
          ${falsch ? '<span class="pill schlecht">falsch</span>' : `<button class="btn klein" data-do="daward" data-k="${x.key}" data-s="1">✓ +${v}</button><button class="btn klein" data-do="daward" data-k="${x.key}" data-s="-1">✗ −${v}</button>`}</div>`; }).join('') || '<p class="blass">Noch niemand hat gebuzzert.</p>'}</div>
      <div class="klein">Ohne Buzzer werten</div>
      <div class="reihe">${(S.extra.units || []).map(u => `<span class="pill">${esc(u.label)} <button class="btn link" data-do="daward" data-k="${u.key}" data-s="1">+</button> <button class="btn link" data-do="daward" data-k="${u.key}" data-s="-1">−</button></span>`).join('')}</div></div>`;
}

function cockpitAtlas(it) {
  const prev = S.extra.atlasPreview || {}, res = S.atlasRes || {}, tips = {};
  (S.extra.units || []).forEach(u => { const a = u.key.startsWith('t') ? S.teamAnswers[u.key.slice(1)] : S.answers[u.key]; if (a) tips[u.key] = a; });
  return `<div class="klein">${esc(it.setName)} · ${esc(it.marke)}</div><p class="gross">${esc(it.text)}</p>
    <div class="loesung"><div class="klein">Richtig</div><span class="display">${esc(landName(it.land))}</span>
      ${it.auchOk && it.auchOk.length ? `<p class="text">Auch richtig: ${it.auchOk.map(landName).map(esc).join(', ')}</p>` : ''}${it.notiz ? `<p class="text blass">${esc(it.notiz)}</p>` : ''}</div>
    <div class="tabelle">${(S.extra.units || []).map(u => { const t = tips[u.key], r = S.revealed ? res[u.key] : prev[u.key];
      return `<div class="zeile"><div class="wer"><b>${esc(u.label)}</b><span>${t && t.by && u.key.startsWith('t') ? 'getippt von ' + esc(t.by === 'leitung' ? 'Moderation' : code(t.by)) : ''}</span></div>
        <div class="mitte">${t ? `<span class="serif" style="font-size:17px">${esc(landName(t.v))}</span>` : '<span class="blass">wartet</span>'}${r ? `<span class="pill ${r.hit ? 'gut' : ''}">${r.pts} P.${r.hit ? '' : ' · ' + r.km.toLocaleString('de-DE') + ' km'}</span>` : ''}${!S.revealed && r ? '<span class="blass">(Vorschau)</span>' : ''}</div><div></div></div>`; }).join('')}</div>`;
}

function zellenKarten() {
  return `<div class="zellen">${S.teams.map((t, i) => `<div class="zelle"><h3>Zelle ${'ABCD'[i]}</h3>${t.filter(agent).map(id => `<div>${esc(code(id))} <span class="blass">${esc(agent(id).name)}</span></div>`).join('')}</div>`).join('')}</div>`;
}

function steuerung(m, it) {
  const t = m.type, rev = S.revealed, last = S.round >= m.rounds - 1;
  const b = [];
  if (t === 'wette' && !S.showQ) b.push(`<button class="btn rot" data-do="showq">Einsätze schließen, Frage zeigen</button>`);
  else if (!rev) {
    if (t === 'impostor') b.push(`<button class="btn ${S.open ? '' : 'rot'}" data-do="open" data-x="${S.open ? 0 : 1}">${S.open ? 'Abstimmung schließen' : 'Abstimmung öffnen'}</button>`);
    else b.push(`<button class="btn" data-do="open" data-x="${S.open ? 0 : 1}">${S.open ? 'Abgabe schließen' : 'Abgabe wieder öffnen'}</button>`);
    if (t === 'zoom') b.push(`<button class="btn" data-do="zoom" ${S.zoomStep < M.zoom.length - 1 ? '' : 'disabled'}>Herauszoomen (${S.zoomStep + 1}/${M.zoom.length})</button>`);
    if (t === 'sound') b.push(`<button class="btn" data-do="zoom" ${S.zoomStep < M.zoom.length - 1 ? '' : 'disabled'}>Rauschen reduzieren (${S.zoomStep + 1}/${M.zoom.length})</button>`);
    if (t === 'woerterbuch' && S.rnd.wbPhase === 'faelschen') b.push(`<button class="btn rot" data-do="wbabstimmen" ${Object.keys(S.answers).length ? '' : 'disabled'}>Fälschen beenden, Abstimmung starten</button>`);
    else b.push(`<button class="btn rot" data-do="reveal">Aufdecken</button>`);
  }
  if (rev && !last) b.push(`<button class="btn hell" data-do="next">Nächste Runde</button>`);
  if (!rev) b.push(`<button class="btn link" data-do="skip" title="Anderen Eintrag ziehen, Runde bleibt gleich">Eintrag überspringen</button>`);
  return `<div class="reihe">${b.join('')}</div>`;
}

function bühne(m, it, step) {
  const t = m.type, rev = S.revealed, x = S.extra;
  let h = '';
  if (t === 'schaetzen') h = `<p class="gross">${esc(it.q)}</p><div class="loesung"><div class="klein">Lösung</div><span class="display">${esc(it.a)} ${esc(it.unit || '')}</span></div>`;
  if (t === 'ranking') {
    const ln = it.items.split('\n').map(s => s.trim()).filter(Boolean);
    h = `<p class="gross">${esc(it.q)}</p><div class="loesung"><div class="klein">Richtige Folge</div><span class="display">${esc(x.rankCode)}</span>
      <ol class="regeln" style="margin-top:8px">${ln.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>`;
  }
  if (t === 'impostor') h = `<div class="loesung"><div class="klein">Eindringling</div><span class="display">${esc(code(S.rnd.spy))}</span><p class="text">Parole: <b>${esc(it.word)}</b> · Kategorie des Eindringlings: ${esc(it.cat)}</p></div>
      <p class="text blass">Jedes Gerät zeigt verdeckt sein Losungswort bzw. dem Spitzel die Kategorie. Zwei Wortrunden, dann Abstimmung öffnen.</p>`;
  if (t === 'zoom') h = `<div class="lupe"><img src="${esc(it.img)}" alt="" style="transform-origin:${S.rnd.ox}% ${S.rnd.oy}%;transform:scale(${M.zoom[S.zoomStep]})"></div><div class="loesung"><div class="klein">Lösung</div><span class="display">${esc(it.a)}</span></div>`;
  if (t === 'sound') {
    const yt = /youtu\.?be/.test(it.src || '');
    h = `<div class="loesung"><div class="klein">Lösung</div><span class="display">${esc(it.a)}</span></div>
      ${!it.src ? '<p class="text">Keine Quelle eingetragen.</p>' : yt ? `<a class="btn" href="${esc(it.src)}" target="_blank" rel="noopener">YouTube öffnen</a><p class="text blass">In Discord den ganzen Bildschirm mit Ton teilen.</p>`
      : `<div class="reihe"><span class="klein">Ton auf der Leinwand</span><button class="btn" data-do="audio" data-x="play">Abspielen</button><button class="btn" data-do="audio" data-x="pause">Pause</button><button class="btn" data-do="audio" data-x="restart">Von vorn</button></div>
         <audio controls preload="none" src="${esc(it.src)}" style="width:100%"></audio><span class="klein">Der Player hier ist nur zum Vorhören auf diesem Gerät.</span>`}`;
  }
  if (t === 'hoeher') h = `<div class="loesung"><div class="klein">Das Amt verkündet</div><span class="display">${esc(S.rnd.claim === 'A' ? it.a : it.b)}!</span>
      <p class="text">Richtig ist: <b>${x.propaganda === 'W' ? 'Wahrheit' : x.propaganda === 'P' ? 'Propaganda' : 'Werte prüfen'}</b></p></div><p class="gross">${esc(it.q)}</p><div class="reihe"><div class="loesung" style="flex:1"><div class="klein">A</div><span class="display">${esc(it.a)}</span><p class="text">${esc(it.av)}</p></div>
      <div class="loesung" style="flex:1"><div class="klein">B</div><span class="display">${esc(it.b)}</span><p class="text">${esc(it.bv)}</p></div></div><p class="text">Richtig: <b>${esc(x.hoeherCorrect || 'Gleichstand / Werte prüfen')}</b></p>`;
  if (t === 'emoji') h = `<div style="font-size:72px;line-height:1.1">${esc(it.e)}</div><div class="loesung"><div class="klein">Lösung</div><span class="display">${esc(it.a)}</span></div>`;
  if (t === 'woerterbuch') {
    const r = S.rnd, code = id => ((agent(id) || {}).code || '?');
    h = `<div class="loesung"><div class="klein">Beschlagnahmt</div><span class="display">${esc(it.wort)}</span> <span class="klein">${esc(it.art || '')}</span><p class="text">Echt: <b>${esc(it.def)}</b></p></div>`;
    if (r.wbPhase === 'faelschen') {
      h += `<div class="box"><div class="klein">Fälschungen · <span class="signal">●</span> sieht nach der echten Bedeutung aus</div>
        <div class="funk">${Object.entries(S.answers).map(([id, a]) => { const tr = (r.treffer || []).includes(id), weg = (r.gestrichen || []).includes(id);
          return `<div class="${tr ? 'r' : ''}" style="grid-template-columns:110px 1fr auto;${weg ? 'opacity:.4' : ''}"><b>${esc(code(id))}</b><span class="serif">${(x.wbMatch || {})[id] ? '<span class="signal">● </span>' : ''}${esc(a.v)}</span>
            <span class="reihe"><button class="btn klein ${tr ? 'hell' : ''}" data-do="wbtreffer" data-id="${id}" title="Stimmt mit der echten Bedeutung überein: sofort +${step}">${tr ? 'Treffer ✓' : 'Treffer'}</button><button class="btn klein" data-do="wbweg" data-id="${id}" title="Nicht in die Abstimmung nehmen">${weg ? 'wieder rein' : 'streichen'}</button></span></div>`; }).join('') || '<p class="blass">Noch keine Fälschung eingegangen.</p>'}</div></div>`;
    } else {
      const stimmen = {}; Object.entries(S.votes).forEach(([v, nr]) => (stimmen[nr] = stimmen[nr] || []).push(v));
      h += `<div class="box"><div class="klein">${S.revealed ? 'Ergebnis' : 'Abstimmung läuft'} · ${Object.keys(S.votes).length} Stimmen</div><div class="funk">${(r.optionen || []).map((o, i) => `<div style="grid-template-columns:40px 1fr auto;${o.id === 'echt' ? 'background:#1f2616' : ''}"><b>${'ABCDEFGHIJKLMNOP'[i]}</b><span class="serif">${esc(o.text)}</span>
        <span class="klein">${o.id === 'echt' ? 'echt' : esc(code(o.id))} · ${(stimmen[i] || []).map(code).map(esc).join(', ') || '–'}</span></div>`).join('')}</div></div>`;
    }
  }
  if (t === 'schwaerzung') {
    const code = id => ((agent(id) || {}).code || '?');
    h = `<div class="loesung"><div class="klein">${esc(it.quelle || '')}</div><p class="gross" style="white-space:pre-line">${esc(it.text).replace(/\[\[(.+?)\]\]/, '<b class="signal">$1</b>')}</p></div>
      <div class="box"><div class="reihe" style="justify-content:space-between"><span class="klein">Antworten · <span class="signal">●</span> passt zu „${esc(x.schwarzWort)}“</span>
        <button class="btn klein ${S.revealed ? 'rot' : ''}" data-do="awardschwarz">Alle ● als richtig werten</button></div>
      <div class="funk">${Object.entries(S.answers).map(([id, a]) => `<div class="${S.judged[id] === 'r' ? 'r' : ''}" style="grid-template-columns:110px 1fr auto"><b>${esc(code(id))}</b><span class="serif">${(x.schwarzMatch || {})[id] ? '<span class="signal">● </span>' : ''}${esc(a.v)}</span>
        <span class="reihe"><button class="btn klein" data-do="judge" data-id="${id}" data-x="1">✓ +${step}</button><button class="btn klein" data-do="judge" data-id="${id}" data-x="0">✗</button></span></div>`).join('') || '<p class="blass">Noch keine Antwort.</p>'}</div></div>`;
  }
  if (t === 'wette') h = `<div class="loesung"><div class="klein">Kategorie</div><span class="display">${esc(it.cat)}</span><p class="gross">${esc(it.q)}</p><p class="text">Antwort: <b>${esc(it.a)}</b></p></div>`;
  const bw = (it.beute || '').trim();
  return h + steuerung(m, it) + (M.games[t] && ['zoom', 'sound', 'emoji'].includes(t) ? funk(m, step) : '')
    + (bw ? `<div class="klein">${S.revealed ? 'Geborgen – steht jetzt auf Leinwand und Handys' : 'Beutewort dieser Runde, erscheint beim Aufdecken'}</div>${WWH.karte({ ...((S.kartei || {})[bw] || {}), wort: bw }, { klein: true })}` : '');
}

function funk(m, step) {
  const feed = S.feed.map((f, i) => ({ ...f, i, passt: (S.extra.feedMatch || [])[i], wert: (S.extra.feedWert || [])[i] })).sort((a, b) => a.t - b.t);
  if (!feed.length) return `<div class="box"><div class="klein">Funksprüche</div><p class="blass">Noch keine Antwort eingegangen.</p></div>`;
  const t0 = feed[0].t;
  return `<div class="box"><div class="klein">Funksprüche, der Reihe nach · ✓ gibt ${m.type === 'zoom' ? 'je nach Zoomstufe' : '+' + step} · <span class="signal">●</span> sieht nach der Lösung aus</div><div class="funk">${feed.map(f => `<div class="${S.judged[f.id] === 'r' ? 'r' : ''}">
      <span class="blass">+${(f.t - t0).toFixed(1)} s</span><b>${esc(code(f.id))}</b><span class="serif">${f.passt ? '<span class="signal">● </span>' : ''}${esc(f.v)}</span>
      <span class="reihe">${f.wert ? `<span class="klein">Stufe ${(f.z || 0) + 1}</span>` : ''}<button class="btn klein ${f.passt ? 'rot' : ''}" data-do="judge" data-id="${f.id}" data-i="${f.i}" data-x="1">✓${f.wert ? ' +' + f.wert : ''}</button><button class="btn klein" data-do="judge" data-id="${f.id}" data-x="0">✗</button></span></div>`).join('')}</div></div>`;
}

function wertung(m, step) {
  const t = m.type, rev = S.revealed, x = S.extra, team = m.mode === 'team';
  let h = `<div class="reihe" style="justify-content:space-between"><span class="klein">Wertung dieser Mission</span><span class="klein">${t === 'wette' ? 'Einsatz eintragen' : '+' + step + ' pro Treffer'}</span></div>`;

  if (team && S.teams.length) {
    if ((t === 'ranking' || t === 'hoeher') && S.phase === 'play') {
      const n = (x.teamCorrect || []).filter(Boolean).length;
      h += `<div class="reihe"><button class="btn ${rev && !S.awarded ? 'rot' : ''}" data-do="awardteams" ${S.awarded || !n ? 'disabled' : ''}>${S.awarded ? 'Richtige Zellen belohnt' : `+${step} an ${n} richtige Zelle${n === 1 ? '' : 'n'}`}</button>
      ${t === 'ranking' ? `<span class="klein">${S.rnd.schnellste != null ? 'Tempo-Bonus +1 an Zelle ' + 'ABCD'[S.rnd.schnellste] : 'Die schnellste richtige Zelle bekommt +1'}</span>` : ''}</div>`;
    }
    h += `<div class="tabelle">${S.teams.map((ids, i) => {
      const ta = S.teamAnswers[i], ok = (x.teamCorrect || [])[i];
      const eingabe = (t === 'ranking' || t === 'hoeher') && S.phase === 'play'
        ? `<input class="feld kurz" data-k="ta-${i}" value="${esc(ta ? ta.v : '')}" placeholder="${t === 'hoeher' ? 'W oder P' : 'z. B. CADB'}" data-change="teamanswer" data-i="${i}">${ta ? `<span class="pill ${ok ? 'gut' : 'schlecht'}">${ok ? 'richtig' : 'falsch'}</span>` : '<span class="blass">wartet</span>'}${ta && !ok && t === 'ranking' && x.teamPlaces ? `<span class="klein">${x.teamPlaces[i]} von ${S.rnd.item.items.split('\n').filter(z => z.trim()).length} am richtigen Platz</span>` : ''}` : '';
      return `<div class="zeile"><div class="wer"><b>Zelle ${'ABCD'[i]}</b><span>${ids.filter(agent).map(code).map(esc).join(' · ')}</span></div>
        <div class="mitte">${eingabe}</div>
        <div class="aktion"><span class="plus">${fmtGain(S.gains[ids[0]])}</span><button class="btn klein" data-do="gteam" data-i="${i}" data-d="-${step}">−${step}</button><button class="btn klein" data-do="gteam" data-i="${i}" data-d="${step}">+${step}</button></div></div>`;
    }).join('')}</div>`;
    return h;
  }

  const closest = x.closest || [];
  if (t === 'schaetzen' && rev && closest.length) h += `<div><button class="btn ${S.awarded ? '' : 'rot'}" data-do="awardclosest" ${S.awarded ? 'disabled' : ''}>${S.awarded ? 'Vergeben' : `+${step} an ${closest.map(code).map(esc).join(' & ')}`}</button></div>`;
  if (t === 'impostor' && S.mole.on && !S.mole.result) h += `<div class="reihe"><button class="btn ${S.mole.voteOpen ? 'rot' : ''}" data-do="mvote" data-x="${S.mole.voteOpen ? 0 : 1}">${S.mole.voteOpen ? 'Maulwurf-Abstimmung schließen' : 'Zusatzfrage: Wer ist der Maulwurf?'}</button><span class="klein">${Object.keys(S.moleVotes).length} Stimmen</span></div>`;
  if (t === 'impostor' && rev) h += `<div class="reihe">${S.spyResult ? `<span class="pill an">${S.spyResult === 'caught' ? 'Erkannt – alle anderen +' + step : 'Unerkannt – Eindringling +' + (2 * step)}</span>`
      : `<button class="btn rot" data-do="spy" data-x="1">Eindringling erkannt</button><button class="btn" data-do="spy" data-x="0">Nicht erkannt</button>`}</div>`;

  const tally = x.tally || {};
  h += `<div class="tabelle">${sorted().map(a => {
    const id = a.id, ans = S.answers[id];
    let mitte = '';
    if (t === 'schaetzen' && S.phase === 'play') {
      const diff = rev && ans ? Math.abs(WWH.deNum(ans.v) - WWH.deNum(S.rnd.item.a)) : NaN;
      mitte = `<input class="feld kurz" data-k="g-${id}" value="${esc(ans ? ans.v : '')}" placeholder="Schätzung" data-change="answer" data-id="${id}" inputmode="decimal">${!isNaN(diff) ? `<span class="${closest.includes(id) ? 'signal' : 'blass'}">± ${diff.toLocaleString('de-DE')}</span>` : ''}`;
    }
    if (t === 'wette' && S.phase === 'play') {
      const bet = S.bets[id], done = S.betDone[id];
      mitte = `<input class="feld kurz" style="width:80px" data-k="b-${id}" value="${bet ?? ''}" placeholder="max ${(x.betCaps || {})[id]}" data-change="bet" data-id="${id}" ${S.revealed ? 'disabled' : ''}>
        <span class="serif">${esc(ans ? ans.v : '')}</span>` + (rev ? (done ? `<span class="pill ${done === 'r' ? 'gut' : 'schlecht'}">${done === 'r' ? 'richtig +' : 'falsch −'}${bet || 0}</span>`
          : (bet ? `<button class="btn klein" data-do="judge" data-id="${id}" data-x="1">Richtig</button><button class="btn klein" data-do="judge" data-id="${id}" data-x="0">Falsch</button>` : '<span class="blass">kein Einsatz</span>')) : '');
    }
    if (t === 'impostor' && S.phase === 'play') {
      mitte = `${id === S.rnd.spy ? '<span class="pill schlecht">Eindringling</span>' : ''}${S.votes[id] ? `<span class="blass">stimmt für ${esc(code(S.votes[id]))}</span>` : ''}${tally[id] ? `<span class="pill">${tally[id]} Stimme${tally[id] === 1 ? '' : 'n'}</span>` : ''}`;
    }
    if (['zoom', 'sound', 'emoji'].includes(t) && S.judged[id]) mitte = `<span class="pill ${S.judged[id] === 'r' ? 'gut' : 'schlecht'}">${S.judged[id] === 'r' ? 'Treffer' : 'daneben'}</span>`;
    return `<div class="zeile ${closest.includes(id) && rev ? 'nah' : ''}"><div class="wer"><b>${esc(a.code)}</b><span>${esc(a.name)} · ${total(id)}</span></div>
      <div class="mitte">${mitte}</div>
      <div class="aktion"><span class="plus">${fmtGain(S.gains[id])}</span>${t === 'wette' ? '' : `<button class="btn klein" data-do="gain" data-id="${id}" data-d="-${step}">−${step}</button><button class="btn klein" data-do="gain" data-id="${id}" data-d="${step}">+${step}</button>`}</div></div>`;
  }).join('')}</div>`;
  if (t === 'wette' || G(t).ext) h += `<p class="text blass">Feinkorrektur: ± 1 Wort pro Klick</p><div class="reihe">${sorted().map(a => `<span class="pill">${esc(a.code)} <button class="btn link" data-do="gain" data-id="${a.id}" data-d="-1">−</button> ${fmtGain(S.gains[a.id]) || '0'} <button class="btn link" data-do="gain" data-id="${a.id}" data-d="1">+</button></span>`).join('')}</div>`;
  return h;
}

// ------------------------------------------------------------------ Aktionen
actions(app, {
  missionStart: () => cmd('mission_start'),
  finale: () => cmd('screen', { name: 'finale' }),
  dieb: d => cmd('steal_thief', { id: d.id }),
  opfer: d => cmd('steal_victim', { id: d.id }),
  verzicht: () => cmd('steal_skip'),
  add: () => { const e = document.getElementById('neuName'); const n = e.value.trim(); if (n) { cmd('agent_add', { name: n }); e.value = ''; } },
  del: d => { if (confirm(code(d.id) + ' wirklich entfernen? Das Gerät ist dann abgemeldet.')) cmd('agent_del', { id: d.id }); },
  reroll: d => cmd('agent_reroll', { id: d.id }),
  score: d => cmd('score_adj', { id: d.id, d: +d.d }),
  link: d => kopieren(geraeteLink(agent(d.id))),
  join: () => cmd('join_toggle'),
  reset: () => { if (confirm('Abend wirklich neu starten? Punkte und Fortschritt gehen verloren.')) cmd('evening_reset'); },
  clear: () => { if (confirm('Alle Agenten entfernen? Ihre Geräte sind danach abgemeldet.')) cmd('agents_clear'); },
  pmode: d => { const p = structuredClone(S.plan); p[+d.i].mode = d.x; planSenden(p); },
  pmove: d => { const i = +d.i, j = i + +d.d; if (j < 0 || j >= S.plan.length) return; const p = structuredClone(S.plan); [p[i], p[j]] = [p[j], p[i]]; planSenden(p); },
  pdel: d => { const i = +d.i; planSenden(S.plan.filter((_, j) => j !== i), i < S.cur ? S.cur - 1 : S.cur); },
  padd: d => { const g = G(d.x); planSenden([...S.plan, { type: d.x, mode: g.mode, pts: g.pts, rounds: g.rounds }]); },
  preset: () => { if (confirm('Plan auf den Standardablauf zurücksetzen?')) cmd('plan_reset'); },
  atab: d => { ui.archiv = d.x; zeichnen(); },
  cadd: () => contentSenden([...(S.content[ui.archiv] || []), {}]),
  cdel: d => { if (confirm('Eintrag löschen?')) contentSenden((S.content[ui.archiv] || []).filter((_, j) => j !== +d.i)); },
  crestore: () => { if (confirm('Beispiele dieses Spiels wiederherstellen? Eigene Einträge dieses Spiels werden ersetzt.')) cmd('content_restore', { type: ui.archiv }); },
  joinurl: async () => { try { await post('/leitung/api/config', { joinUrl: document.getElementById('joinUrl').value }); hinweis('Gespeichert'); } catch (e) { hinweis(e.message); } },
  abbruch: () => { if (confirm('Mission abbrechen? Punkte dieser Mission verfallen, die Mission bleibt offen.')) cmd('mission_abort'); },
  fertig: () => { if (S.phase === 'play' && !(S.revealed && S.round >= mission().rounds - 1) && !confirm('Es sind noch Runden offen. Trotzdem abschließen?')) return; cmd('mission_finish'); ui.tab = 'zentrale'; },
  tcount: d => cmd('teams_count', { n: +d.x }),
  treroll: () => cmd('teams_reroll'),
  beginnen: d => { if (d.ext) window.open('/leitung/' + d.ext, 'wwh_ext'); cmd('mission_begin'); },
  showq: () => cmd('show_q'),
  open: d => cmd('open', { on: d.x === '1' }),
  zoom: () => cmd('zoom_out'),
  reveal: () => cmd('reveal'),
  next: () => cmd('round_next'),
  skip: () => cmd('round_skip'),
  audio: d => cmd('audio', { a: d.x }),
  judge: d => cmd('judge', { id: d.id, ok: d.x === '1', i: d.i != null ? +d.i : undefined }),
  gain: d => cmd('gain', { id: d.id, d: +d.d }),
  gteam: d => cmd('gain_team', { idx: +d.i, d: +d.d }),
  awardclosest: () => cmd('award_closest'),
  awardteams: () => cmd('award_teams'),
  spy: d => cmd('spy_award', { caught: d.x === '1' }),
  wbabstimmen: () => cmd('wb_abstimmen'),
  wbtreffer: d => cmd('wb_treffer', { id: d.id }),
  wbweg: d => cmd('wb_streichen', { id: d.id }),
  awardschwarz: () => cmd('award_schwarz'),
  uadj: d => cmd('upts_adj', { key: d.k, d: +d.d }),
  prologzeigen: () => cmd('screen', { name: 'prolog' }),
  prolog: d => cmd('prolog_step', { d: +d.d }),
  prologende: () => cmd('screen', { name: 'hq' }),
  fstufe: d => cmd('finale_step', { d: +d.d }),
  mtoggle: d => cmd('mole_toggle', { on: d.x === '1' }),
  mpick: () => { if (confirm('Einen neuen Maulwurf bestimmen? Die bisherige Person weiß dann nichts mehr davon – ihr Gerät zeigt sofort die Zellen-Karte.')) cmd('mole_pick'); },
  mzeig: () => { ui.zeigMole = !ui.zeigMole; zeichnen(); },
  zielart: d => cmd('settings', { ziel: d.x === 'auto' ? -1 : d.x === 'aus' ? 0 : Math.max(1, S.extra.ziel.wert || 8 * S.agents.length) }),
  mvote: d => cmd('mole_vote', { on: d.x === '1' }),
  mresolve: () => { if (confirm('Maulwurf jetzt enthüllen? Rucksack oder Prämie werden sofort verrechnet.')) cmd('mole_resolve'); },
  dpadd: () => { const st = structuredClone(S.story || {}); st.prolog = [...(st.prolog || []), { titel: 'Neue Tafel', text: '' }]; drehbuchSenden(st); },
  dpdel: d => { if (!confirm('Tafel löschen?')) return; const st = structuredClone(S.story || {}); st.prolog.splice(+d.i, 1); drehbuchSenden(st); },
  export: async () => {   // per fetch statt Link: kein Seitenwechsel, die Verbindung bleibt stehen
    try {
      const r = await fetch('/leitung/api/export', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const name = ((r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/) || [])[1] || 'wwh-spielstand.json';
      const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      hinweis('Spielstand exportiert: ' + name);
    } catch (e) { hinweis('Export fehlgeschlagen: ' + e.message); }
  },
  cursorweg: d => cmd('cursor_reset', { type: d.x }),
  cursorallesweg: () => { if (confirm('Bei allen Spielen wieder mit dem ersten Eintrag beginnen?')) cmd('cursor_reset', {}); },
  kzeig: d => { ui.kartei = d.x; zeichnen(); },
  kdel: d => { if (confirm('Karteikarte „' + d.x + '“ löschen?')) cmd('kartei_del', { wort: d.x }); },
  krestore: () => { if (confirm('Mitgelieferte Karteikarten wiederherstellen? Eigene Änderungen an diesen Karten werden überschrieben.')) cmd('kartei_restore'); },
  drestore: () => { if (confirm('Alle Drehbuch-Texte auf die Vorlage zurücksetzen?')) cmd('story_restore'); },
  dopen: d => cmd('dep_open', { c: +d.c, p: +d.p }),
  dreopen: d => { if (confirm('Dieses Feld wieder öffnen?')) cmd('dep_reopen', { c: +d.c, p: +d.p }); },
  dstage: () => cmd(S.dep.stage >= 2 ? 'dep_close' : 'dep_stage'),
  dclose: () => cmd('dep_close'),
  dtimer: () => cmd('dep_timer'),
  darm: () => cmd('dep_arm'),
  deparm: d => cmd('settings', { depArm: d.x === '1' }),
  dbuzzreset: () => cmd('dep_buzz_reset'),
  daward: d => cmd('dep_award', { key: d.k, sign: +d.s }),
  bwahl: d => { if (ui.boardDirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return; ui.boardDirty = false; ui.boardId = d.id; ui.offen = null; zeichnen(); },
  bneu: async () => { if (ui.boardDirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return; const id = 'b' + Date.now().toString(36);
    await cmd('board_save', { board: { id, name: 'Neues Board', pts: [100, 200, 300, 400, 500], cats: [1, 2, 3].map(n => ({ name: 'Kategorie ' + n })) } }); ui.boardDirty = false; ui.boardId = id; },
  bsave: () => boardSpeichern(),
  bdel: () => { if (confirm('Board „' + ui.board.name + '“ löschen?')) { cmd('board_del', { id: ui.boardId }); ui.boardId = null; ui.boardDirty = false; } },
  brestore: () => cmd('board_restore'),
  bexport: () => { const b = ui.board, a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' })); a.download = (b.name || 'board').replace(/\s+/g, '_') + '.json'; a.click(); },
  bcadd: () => { ui.board.cats.push({ name: 'Neue Kategorie', qh: {}, hh: {}, ah: {}, rk: {} }); ui.boardDirty = true; ui.offen = ui.board.cats.length - 1; zeichnen(); },
  bcdel: d => { if (!confirm('Kategorie „' + ui.board.cats[+d.i].name + '“ entfernen?')) return; ui.board.cats.splice(+d.i, 1); ui.boardDirty = true; zeichnen(); },
  swahl: d => { ui.setId = d.id; zeichnen(); },
  sneu: () => { ui.setId = 's' + Date.now().toString(36); setSenden({ name: 'Neues Set', marke: 'Woher stammt das?', eintraege: [] }); },
  sdel: () => { if (confirm('Set „' + S.atlasSets[ui.setId].name + '“ löschen?')) { cmd('atlas_set_del', { id: ui.setId }); ui.setId = null; } },
  srestore: () => cmd('atlas_restore'),
  seadd: () => { const set = structuredClone(S.atlasSets[ui.setId]); set.eintraege.push({ text: '', land: '', auchOk: [], notiz: '' }); setSenden(set); },
  sedel: d => { const set = structuredClone(S.atlasSets[ui.setId]); set.eintraege.splice(+d.i, 1); setSenden(set); },
});

// Eingabefelder: speichern beim Verlassen (change)
app.addEventListener('change', async e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'import') {
    const f = el.files[0]; if (!f || !confirm('Den aktuellen Spielstand durch die Datei ersetzen?')) return;
    try { await post('/leitung/api/import', JSON.parse(await f.text())); hinweis('Importiert'); } catch (err) { hinweis('Import fehlgeschlagen: ' + err.message); }
    return;
  }
  if (el.hasAttribute('data-upload')) {
    const f = el.files[0]; if (!f) return;
    hinweis('Lade hoch …');
    try {
      const r = await fetch('/leitung/api/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name) }, body: f });
      const j = await r.json(); if (!j.ok) throw new Error(j.error);
      const list = structuredClone(S.content[ui.archiv] || []); list[+d.i] = { ...list[+d.i], [d.f]: j.url }; contentSenden(list); hinweis('Hochgeladen');
    } catch (err) { hinweis('Upload fehlgeschlagen: ' + err.message); }
    return;
  }
  if (el.hasAttribute('data-bimport')) {
    const f = el.files[0]; if (!f) return;
    try { const b = JSON.parse(await f.text()); if (!b.cats || !b.pts) throw new Error('kein Deppardy-Board'); await cmd('board_save', { board: b, neu: true }); hinweis('„' + (b.name || 'Board') + '“ importiert'); }
    catch (err) { hinweis('Import fehlgeschlagen: ' + err.message); }
    return;
  }
  if (el.hasAttribute('data-bupload')) {
    const f = el.files[0]; if (!f) return;
    try {
      const r = await fetch('/leitung/api/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name) }, body: f });
      const j = await r.json(); if (!j.ok) throw new Error(j.error);
      const [art, ci, p] = el.dataset.bupload.split(':'), cat = ui.board.cats[+ci];
      cat[art][p] = (cat[art][p] || '') + (f.type.startsWith('audio') ? `<audio controls src="${j.url}"></audio>` : `<img src="${j.url}" alt="">`);
      ui.boardDirty = true; zeichnen(); hinweis('Eingefügt – Speichern nicht vergessen');
    } catch (err) { hinweis('Upload fehlgeschlagen: ' + err.message); }
    return;
  }
  if (d.bf) { boardFeld(d.bf, el); return; }
  if (d.sf) { setFeld(d.sf, el.value); return; }
  if (d.df) { drehbuchFeld(d.df, el.value); return; }
  if (d.pm !== undefined) { const st = structuredClone(S.story || {}); if (el.checked) st.prolog[+d.pm].maulwurf = true; else delete st.prolog[+d.pm].maulwurf; drehbuchSenden(st); return; }
  if (d.kf) { const alt = (S.kartei || {})[d.w] || {}, neu = { ...alt, [d.kf]: el.value }; S.kartei = { ...(S.kartei || {}), [d.w]: neu }; cmd('kartei_set', { wort: d.w, ...neu }); return; }
  const v = el.value;
  switch (d.change) {
    case 'popt': { const p = structuredClone(S.plan); p[+d.i].opt = v; return planSenden(p); }
    case 'ddur': return cmd('dep_dur', { s: parseInt(v) || 0 });
    case 'mbonus': return cmd('mole_bonus', { n: parseInt(v) || 0 });
    case 'regel': return cmd('settings', { [d.f]: parseInt(v) || 0 });
    case 'stealAmount': return cmd('settings', { stealAmount: +v || 0 });
    case 'rename': return cmd('agent_rename', { id: d.id, name: v });
    case 'prounds': { const p = structuredClone(S.plan); p[+d.i].rounds = Math.max(1, parseInt(v) || 1); return planSenden(p); }
    case 'ppts': { const p = structuredClone(S.plan); p[+d.i].pts = Math.max(0, parseInt(v) || 0); return planSenden(p); }
    case 'content': { const list = structuredClone(S.content[ui.archiv] || []); list[+d.i] = { ...list[+d.i], [d.f]: v }; return contentSenden(list); }
    case 'answer': return cmd('set_answer', { id: d.id, v });
    case 'bet': return cmd('set_bet', { id: d.id, v: parseInt(v) || 0 });
    case 'teamanswer': return cmd('set_team_answer', { idx: +d.i, v });
  }
});
app.addEventListener('input', e => { if (e.target.id === 'ksuche') { ui.ksuche = e.target.value; clearTimeout(ui.kt); ui.kt = setTimeout(zeichnen, 250); return; } const d = e.target.dataset; if (d.bf && e.target.type !== 'checkbox') boardFeld(d.bf, e.target); });
app.addEventListener('toggle', e => { if (e.target.matches('details.kat')) { if (e.target.open) ui.offen = +e.target.dataset.ci; else if (ui.offen === +e.target.dataset.ci) ui.offen = null; } }, true);
// Deppardy-Tastatur im Cockpit
document.addEventListener('keydown', e => {
  if (ui.tab !== 'mission' || !S || !S.dep || S.phase !== 'play' || !S.dep.cell) return;
  const tag = e.target.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const d = S.dep, erster = d.buzz.find(x => !d.wrong.includes(x.key));
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cmd(d.stage >= 2 ? 'dep_close' : 'dep_stage'); }
  else if (e.key === 'Escape') cmd('dep_close');
  else if (e.key === 't' || e.key === 'T') cmd('dep_timer');
  else if (e.key === 'b' || e.key === 'B') cmd('dep_arm');
  else if ((e.key === 'r' || e.key === 'R') && erster) cmd('dep_award', { key: erster.key, sign: 1 });
  else if ((e.key === 'f' || e.key === 'F') && erster) cmd('dep_award', { key: erster.key, sign: -1 });
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'neuName') { e.preventDefault(); app.querySelector('[data-do="add"]').click(); }
  else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.dataset.change) e.target.blur();
});
</script>
</body>
