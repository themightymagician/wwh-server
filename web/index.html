<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<title>WWH · Agentengerät</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/wwh.css">
<style>
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--kante);position:sticky;top:0;background:var(--nacht);z-index:5;}
.kopf .code{font-family:var(--display);font-size:clamp(19px,6.2vw,30px);text-transform:uppercase;line-height:1;hyphens:auto;}
.kopf>div:first-child{min-width:0;}
.kopf .wort{text-align:right;}
.kopf .wort b{font-family:var(--display);font-size:30px;font-weight:400;display:block;line-height:1;}
.kopf .wort b.plus{color:var(--signal);}
main{padding:22px 18px 60px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px;}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.92;text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto;}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,7.5vw,30px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto;}
.text{font-family:var(--serif);font-size:19px;line-height:1.45;margin:0;}
.regeln{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:r;}
.regeln li{display:grid;grid-template-columns:28px 1fr;font-family:var(--serif);font-size:17px;line-height:1.4;counter-increment:r;}
.regeln li::before{content:counter(r,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--signal);padding-top:4px;}
.karte{background:var(--nacht-2);border:1px solid var(--kante);padding:18px;display:flex;flex-direction:column;gap:14px;}
.karte.hell{background:var(--papier);color:var(--nacht);border-color:var(--papier);}
.reihe{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.gross{font-size:22px;padding:16px 14px;}
.btn.voll{width:100%;padding:18px;font-size:15px;}
.ok{color:var(--gruen);font-size:13px;letter-spacing:.1em;text-transform:uppercase;}
.wahl{display:grid;gap:10px;}
.wahl button{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;background:var(--nacht-2);border:1px solid var(--kante);padding:14px;cursor:pointer;font-family:var(--serif);font-size:18px;}
.wahl button .bu{font-family:var(--display);font-size:28px;color:var(--signal);text-align:center;}
.wahl button.an{border-color:var(--signal);background:#2e1a15;}
.wahl button:disabled{opacity:.35;}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ab button{background:var(--nacht-2);border:1px solid var(--kante);padding:22px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;}
.ab button b{font-family:var(--display);font-size:44px;font-weight:400;color:var(--signal);line-height:1;}
.ab button span{font-family:var(--serif);font-size:18px;}
.ab button.an{border:2px solid var(--signal);background:#2e1a15;}
.folge{font-family:var(--display);font-size:44px;letter-spacing:.12em;min-height:52px;color:var(--papier);}
.geheim{background:var(--papier);color:var(--nacht);padding:26px 20px;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative;}
.geheim .display{font-size:clamp(30px,10vw,56px);overflow-wrap:anywhere;hyphens:auto;}
.geheim.zu{background:repeating-linear-gradient(-45deg,var(--nacht-3) 0 14px,var(--nacht-2) 14px 28px);color:var(--papier);border:1px solid var(--kante);}
.stimmen{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.stimmen button{background:var(--nacht-2);border:1px solid var(--kante);padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;}
.stimmen button b{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;}
.stimmen button span{font-size:12px;color:var(--blass);}
.stimmen button.an{border-color:var(--signal);background:#2e1a15;}
.versuche{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;}
.versuche li{font-family:var(--serif);font-size:16px;color:var(--papier-matt);border-left:3px solid var(--kante-hell);padding:2px 10px;}
.meldung{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--siegel);color:var(--papier-hell);padding:14px 16px;font-size:14px;z-index:50;}
.rang{display:flex;flex-direction:column;}
.rang div{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--kante);align-items:baseline;}
.rang div.ich{color:var(--signal);}
.rang b{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;}
.pause{border-left:3px solid var(--signal);padding:4px 0 4px 14px;font-family:var(--serif);font-size:17px;color:var(--papier-matt);}
.vorschlaege{display:flex;flex-direction:column;gap:8px;}
.vorschlag{border:1px solid var(--kante);background:var(--nacht-2);padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.vorschlag .kopf2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.vorschlag b{font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;}
.vorschlag ol{margin:0;padding-left:20px;font-family:var(--serif);font-size:15px;color:var(--papier-matt);}
.balken{height:6px;background:var(--nacht-3);position:relative;}
.balken i{position:absolute;left:0;top:0;bottom:0;background:var(--signal);}
.zuversicht{display:flex;flex-direction:column;gap:6px;}
.zuversicht input{width:100%;accent-color:var(--signal);}
.taktuhr{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px;letter-spacing:.08em;text-transform:uppercase;}
.taktuhr b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--signal);}
.umlager{display:flex;flex-direction:column;gap:8px;}
.umlager button{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;background:var(--nacht-2);border:1px solid var(--kante);padding:12px 14px;cursor:pointer;}
.umlager button b{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;}
.umlager button span{font-size:13px;color:var(--blass);}
.umlager button.an{border-color:var(--signal);background:#2e1a15;}
.umlager button:disabled{opacity:.35;}
.warteraum{border:1px solid var(--kante-hell);background:repeating-linear-gradient(-45deg,var(--nacht-2) 0 14px,var(--nacht) 14px 28px);padding:26px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
.warteraum .punkte span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--signal);margin-right:6px;animation:warten 1.4s infinite ease-in-out both;}
.warteraum .punkte span:nth-child(2){animation-delay:.2s;}.warteraum .punkte span:nth-child(3){animation-delay:.4s;}
@keyframes warten{0%,80%,100%{opacity:.2;transform:scale(.7);}40%{opacity:1;transform:scale(1);}}
.schwarz{background:#15130f;color:transparent;border-radius:2px;padding:0 .2em;}
.textblock{font-family:var(--serif);font-size:21px;line-height:1.5;white-space:pre-line;background:#f4edd8;color:#2b251b;padding:18px;}
.optionen{display:flex;flex-direction:column;gap:8px;}
.optionen button{text-align:left;background:var(--nacht-2);border:1px solid var(--kante);padding:12px 14px;font-family:var(--serif);font-size:17px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;}
.optionen button .bu{font-family:var(--display);color:var(--signal);font-size:22px;}
.optionen button.an{border-color:var(--signal);background:#2e1a15;}
.optionen button:disabled{opacity:.4;}
.buzzer{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;align-self:center;border:10px solid #7a1d12;background:radial-gradient(circle at 35% 30%,#f07a64,var(--siegel) 55%,#8f2215);color:var(--papier-hell);font-family:var(--display);font-size:clamp(34px,11vw,52px);text-transform:uppercase;cursor:pointer;box-shadow:0 10px 0 #5c150c;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.buzzer:active{transform:translateY(8px);box-shadow:0 2px 0 #5c150c;}
.feldwert{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.feldwert b{font-family:var(--display);font-weight:400;font-size:40px;color:var(--signal);}
.risiko{display:inline-block;border:3px solid var(--signal);color:var(--signal);font-family:var(--display);font-size:18px;padding:2px 10px;transform:rotate(-4deg);}
#atlasbox{max-width:560px;margin:-40px auto 0;padding:0 18px 90px;display:flex;flex-direction:column;gap:12px;}
#atlaskarte{height:min(52vh,440px);}
.atlasfuss{position:sticky;bottom:0;background:var(--nacht);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--kante);}
.atlasfuss .wahl-name{font-family:var(--display);font-size:26px;text-transform:uppercase;min-height:30px;}
.k-land.vorschlag{fill:#8a6a3a;}
</style>
</head>
<body>
<header class="kopf" id="kopf" hidden></header>
<main id="app"><p class="blass">Verbinde …</p></main>
<section id="atlasbox" hidden>
  <div class="weltkarte" id="atlaskarte"></div>
  <div class="atlasfuss"><div class="klein" id="atlashinweis">Land antippen, mit zwei Fingern zoomen</div><div class="wahl-name" id="atlaswahl"></div>
    <button class="btn rot voll" id="atlassenden" disabled>Tipp abschicken</button></div>
</section>
<div class="meldung" id="meldung" hidden></div>
<script src="/vendor/d3.v7.min.js"></script>
<script src="/vendor/topojson.v3.min.js"></script>
<script src="/karte.js"></script>
<script src="/wwh.js"></script>
<script>
const { esc, pad, poll, post, render, actions, fmtGain } = WWH;
const app = document.getElementById('app'), kopf = document.getElementById('kopf'), meldung = document.getElementById('meldung');

// Token aus dem Geräte-Link übernehmen und aus der Adresszeile entfernen
let token = null;
try { token = localStorage.getItem('wwh_token'); } catch (e) {}
const qp = new URLSearchParams(location.search);
if (qp.get('t')) { token = qp.get('t'); try { localStorage.setItem('wwh_token', token); } catch (e) {} history.replaceState(null, '', '/'); }

let V = null, ME = null;
const lokal = { key: '', folge: '', offen: false };   // Zustand, der nur auf diesem Gerät lebt

function hinweis(t) { meldung.textContent = t; meldung.hidden = false; clearTimeout(hinweis.t); hinweis.t = setTimeout(() => meldung.hidden = true, 3500); }
async function senden(body) { try { await post('/api/act', { t: token, ...body }); } catch (e) { hinweis(e.message); } }

poll(() => '/api/view?t=' + encodeURIComponent(token || ''), d => {
  V = d.view; ME = d.me; zeitDiff = V.now - Date.now() / 1000;
  if (token && d.me === null) { token = null; try { localStorage.removeItem('wwh_token'); } catch (e) {} }
  zeichnen();
});

function zeichnen() {
  if (!token || !ME) { kopf.hidden = true; render(app, beitritt()); return autofokus(); }
  kopf.hidden = false;
  kopf.innerHTML = `<div><div class="klein">Deckname</div><div class="code">${esc(ME.code)}</div></div>
    <div class="wort"><div class="klein">Im Rucksack</div><b class="${ME.gain ? 'plus' : ''}">${ME.total}${ME.gain ? ' <small>' + fmtGain(ME.gain) + '</small>' : ''}</b></div>`;
  const m = V.mission;
  const key = [V.screen, V.cur, V.round, V.phase, m && m.type, V.finaleStufe].join('|');
  if (key !== lokal.key) { lokal.key = key; lokal.folge = ''; lokal.offen = false; lokal.wahl = null; lokal.rolleOffen = false; lokal.reihe = null; lokal.conf = 50; }
  if (WWH.ziehen.aktiv) return;          // nicht neu zeichnen, solange eine Karte gezogen wird
  let html;
  if (V.screen === 'finale') html = finale();
  else if (V.screen === 'prolog') html = prolog();
  else if (V.screen !== 'mission' || !m) html = warten();
  else if (V.phase === 'intro') html = einweisung();
  else if (V.noItem || !V.stage) html = `<p class="pause">Die Moderation bereitet die nächste Runde vor.</p>`;
  else html = spiel();
  if (V.mole && V.mole.voteOpen && V.screen !== 'finale') html = maulwurfWahl() + html;
  if (ME.umlagern) html = umlagernKarte() + html;
  html = misstrauenKarte() + html;
  render(app, html);
  WWH.passeText(app);
  autofokus();
  atlas();
  taktUhr();
}
// Taucht ein neues Eingabefeld auf, steht der Cursor gleich darin – einmal pro Feld und Runde
function autofokus() {
  const feld = app.querySelector('input.feld:not([type=range]):not([disabled]), textarea.feld:not([disabled])');
  if (!feld) return;
  const key = (lokal.key || '') + '|' + (feld.dataset.k || feld.id), aktiv = document.activeElement;
  if (key === lokal.fokus || (aktiv && aktiv !== document.body && app.contains(aktiv) && aktiv.matches('input,textarea'))) return;
  lokal.fokus = key;
  try { feld.focus({ preventScroll: true }); feld.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
}
let zeitDiff = 0;

// Umlagern: die Frage steht auf dem Gerät der Person, die umlagern darf
function umlagernKarte() {
  const u = ME.umlagern, opfer = u.rucksaecke.find(r => r.id === lokal.opfer), ziel = lokal.ziel || ME.id;
  const name = a => esc(a.code) + (V.namenZeigen ? ` <span>${esc(a.name)}</span>` : '');
  let h = `<div class="karte" style="border:2px solid var(--signal)"><div class="klein signal">Du darfst umlagern</div>
    <h2>Aus wessen Rucksack?</h2><p class="text" style="font-size:16px">Ein Teil nimmt unterwegs Schaden. Du kannst in deinen eigenen Rucksack umlagern – oder zur Sicherheit in einen fremden.</p>
    <div class="umlager">${u.rucksaecke.map(r => `<button data-do="uopfer" data-x="${r.id}" class="${lokal.opfer === r.id ? 'an' : ''}" ${r.total > 0 ? '' : 'disabled'}><b>${name(r)}</b><span>${r.total} Wörter · nimmt ${r.menge[0]}, kommen ${r.menge[1]} an</span></button>`).join('')}</div>`;
  if (opfer) {
    const ziele = [{ id: ME.id, code: 'Mein Rucksack', name: '' }].concat(u.rucksaecke.filter(r => r.id !== opfer.id));
    h += `<div class="klein">Wohin mit den ${opfer.menge[1]} Wörtern?</div><div class="umlager">${ziele.map(r => `<button data-do="uziel" data-x="${r.id}" class="${ziel === r.id ? 'an' : ''}"><b>${r.id === ME.id ? 'In meinen Rucksack' : name(r)}</b><span>${r.id === ME.id ? 'für dich selbst' : 'zur Sicherheit'}</span></button>`).join('')}</div>
      <button class="btn rot voll" data-do="umlagern">Umlagern</button>`;
  }
  return h + `<button class="btn voll" data-do="uverzicht">Verzichten${u.bonus ? ` – die Zentrale dankt mit ${u.bonus} Wörtern` : ''}</button></div>`;
}

// Zeittakt bei Schnell-Antwort-Spielen: volle Wörter nur im ersten Takt
let taktTimer = null;
function taktUhr() {
  clearInterval(taktTimer);
  const el = document.getElementById('taktuhr'), tk = V && V.stage && V.stage.takt;
  if (!el || !tk) return;
  const takt = () => {
    const vergangen = Math.max(0, Date.now() / 1000 + zeitDiff - tk.t0), stufe = Math.floor(vergangen / tk.s);
    const wert = Math.max(1, Math.round(tk.voll * Math.pow(0.5, stufe))), rest = Math.ceil(tk.s - (vergangen % tk.s));
    el.innerHTML = `<span>Richtig bringt jetzt</span><b>${wert} Wort${wert === 1 ? '' : 'e'}</b>` + (wert > 1 ? `<span>noch ${rest} s</span>` : '<span></span>');
  };
  takt(); taktTimer = setInterval(takt, 250);
}

function beitritt() {
  if (V && !V.joinOpen) return `<h1>Zelle geschlossen</h1><p class="text">Der Beitritt ist gerade gesperrt. Frag die Moderation nach deinem persönlichen Geräte-Link.</p>`;
  return `<span class="stempel" style="align-self:flex-start;font-size:22px;">Streng geheim</span>
    <h1>Wortgewandter Widerstand</h1>
    <p class="text">Trag deinen Namen ein. Deinen Decknamen bekommst du von der Zentrale.</p>
    <input class="feld gross" data-k="name" id="name" maxlength="40" autocomplete="nickname" placeholder="Dein Name" enterkeyhint="go">
    <button class="btn rot voll" data-do="beitreten">Der Zelle beitreten</button>${impressumLink()}`;
}

function rules(m) { return `<ol class="regeln">${m.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ol>`; }

function meineZelle() {
  if (ME.team == null || !V.teams || !V.teams[ME.team]) return '';
  const mit = V.teams[ME.team].filter(x => x.id !== ME.id).map(x => esc(x.code) + (V.namenZeigen ? ' (' + esc(x.name) + ')' : '')).join(', ');
  return `<div class="karte"><div class="klein">Deine Zelle</div><h2>Zelle ${'ABCD'[ME.team]}</h2><p class="text">${mit ? 'Mit ' + mit : 'Du bist allein in dieser Zelle.'}</p></div>`;
}

const SY = () => V.story || {};
const fuelle = (t, w) => String(t || '').replace(/\{(\w+)\}/g, (x, k) => w[k] ?? x);
function frist() { const h = SY().stunden || 0, t = Math.floor(h / 24), r = h % 24;
  return h <= 0 ? 'Die Säuberung beginnt' : 'Noch ' + (t ? t + ' Tag' + (t === 1 ? '' : 'e') + (r ? ', ' : '') : '') + (r ? r + ' Stunde' + (r === 1 ? '' : 'n') : '') + ' bis zur Großen Säuberung'; }
function tage() { return `<div class="klein signal">${frist()}</div>`; }

// Rolle: für alle im gleichen Format, verdeckt bis zum Antippen
function rolle() {
  if (!ME.rolle) return '';
  const r = ME.rolle;
  return `<div class="geheim ${lokal.rolleOffen ? '' : 'zu'}" data-do="rolle" style="min-height:140px">${lokal.rolleOffen
    ? `<div class="klein" style="color:${r.maulwurf ? '#c23522' : '#5c5446'}">Deine Rolle</div><div class="display" style="font-size:clamp(28px,9vw,44px)">${r.maulwurf ? 'Maulwurf' : 'Zelle ' + esc(SY().zelle || '')}</div><div class="serif" style="font-size:16px;line-height:1.4">${esc(r.text)}</div>`
    : `<div class="display" style="font-size:28px">Deine Rolle</div><div class="serif">Antippen zum Aufdecken. Niemand soll mitlesen.</div>`}</div>`;
}

function maulwurfWahl() {
  const mo = V.mole;
  return `<div class="karte" style="border-color:var(--signal)"><div class="klein signal">Abstimmung</div><h2>${esc(mo.frage)}</h2>
    <div class="stimmen">${V.agents.filter(a => a.id !== ME.id).map(a => `<button data-do="mstimme" data-x="${a.id}" class="${ME.moleVote === a.id ? 'an' : ''}"><b>${esc(a.code)}</b><span>${esc(a.name)}</span></button>`).join('')}</div>
    ${ME.moleVote ? gesendet('Stimme abgegeben – ändern geht bis zum Schluss') : ''}</div>`;
}

function einsatzkarte() {
  return `<div class="karte"><div class="klein">Einsatzkarte</div><h2>${esc(ME.code)}</h2>
    <p class="text">Zelle ${esc(SY().zelle || '')}${SY().auftrag ? '<br><span class="blass">' + esc(SY().auftrag) + '</span>' : ''}</p></div>`;
}

function prolog() {
  const t = SY().tafel;
  return `<div class="klein">Lagebericht${t ? ' ' + pad(t.nr) + ' / ' + pad(SY().prologLen) : ''}</div>
    ${t ? `<h1>${esc(t.titel)}</h1><p class="text">${esc(t.text)}</p>` : ''}${einsatzkarte()}${rolle()}`;
}

// Misstrauensvotum: jederzeit, anonym. Niemand sieht, wer wen gewählt hat – nur ob die Mehrheit richtig lag.
function misstrauenKarte() {
  const mi = V.misstrauen;
  if (!mi || !mi.an || V.screen === 'finale') return '';
  if (mi.laeuft) return `<div class="karte" style="border:2px solid var(--signal)"><div class="klein signal">Misstrauensvotum · anonym</div><h2>Wer arbeitet für das Amt?</h2>
    <p class="text" style="font-size:16px">Trifft die Mehrheit den Maulwurf, bekommt jede Person ${mi.bonus} Wörter. Liegt sie daneben, profitiert das Amt. ${mi.gewaehlt} von ${V.agents.length} haben gewählt.</p>
    <div class="stimmen">${V.agents.filter(a => a.id !== ME.id).map(a => `<button data-do="mmisstrauen" data-x="${a.id}" class="${ME.misstrauenStimme === a.id ? 'an' : ''}"><b>${esc(a.code)}</b>${V.namenZeigen ? `<span>${esc(a.name)}</span>` : ''}</button>`).join('')}</div>
    ${ME.misstrauenStimme ? gesendet('Stimme abgegeben – ändern geht, bis alle gewählt haben') : ''}</div>`;
  let h = '';
  if (mi.letztes && lokal.gesehenMisstrauen !== mi.letztes.n) h += `<div class="karte ${mi.letztes.treffer ? 'hell' : ''}" data-do="misstrauenok"><div class="klein">Ergebnis des Misstrauensvotums</div><p class="text">${esc(mi.letztes.text)}</p><span class="klein">Antippen zum Schließen</span></div>`;
  if (mi.moeglich && V.screen !== 'start') h += `<button class="btn voll" data-do="mantrag">Misstrauensvotum beantragen</button>`;
  return h;
}

function impressumLink() { return V && V.impressum ? `<div class="fuss-impressum"><a href="/impressum" target="_blank" rel="noopener">Impressum</a></div>` : ''; }

// Warteraum: Nach dem Beitreten und zwischen den Einsätzen zeigt das Gerät nur, dass es gleich weitergeht.
// Den nächsten Einsatz sehen alle erst, wenn die Zentrale ihn auf der Leinwand eröffnet.
function warten() {
  const pos = V.ranking.findIndex(r => r.id === ME.id);
  let h = `<div class="warteraum"><div class="klein">${V.screen === 'start' ? 'Warteraum der Zelle' : 'Zentrale'}</div>
    <h2>${V.screen === 'start' ? 'Du bist drin.' : 'Warte auf den nächsten Einsatzbefehl.'}</h2>
    <p class="text" style="font-size:16px">${V.screen === 'start' ? `Dein Deckname ist <b>${esc(ME.code)}</b>. Die Zentrale wartet, bis alle eingetroffen sind – dann geht es gemeinsam los.` : 'Schau auf die Leinwand. Sobald der Einsatz beginnt, erscheint er hier.'}</p>
    <div class="punkte"><span></span><span></span><span></span></div></div>`;
  if (V.screen !== 'start') h += tage();
  if (V.funk && V.funk.text) h += `<div class="karte"><div class="klein">Funkspruch der Zentrale</div><p class="text">${esc(V.funk.text)}</p></div>`;
  if (V.lastSteal) h += `<p class="pause">${esc(V.lastSteal)}</p>`;
  if (V.pendingSteal && V.thief) h += `<p class="pause">${esc(V.thief)} darf jetzt umlagern …</p>`;
  if (V.screen !== 'start' && V.zielLive && V.zielLive.ziel > 0) h += `<div class="klein">Die Zelle hat ${V.zielLive.stand} von ${V.zielLive.ziel} Wörtern beisammen</div>`;
  if (V.screen !== 'start' && pos >= 0) h += `<div class="klein">Dein Rucksack liegt auf Platz ${pos + 1} von ${V.ranking.length}</div>`;
  return h + rolle() + impressumLink();
}

function einweisung() {
  const m = V.mission, mi = SY().mission || {};
  return `<div class="klein">Einsatz ${pad(V.cur + 1)} / ${pad(V.planLen)} · ${esc(m.name)}</div><h1>${esc(mi.ort || m.name)}</h1>
    ${mi.lage ? `<p class="pause">${esc(mi.lage)}</p>` : ''}${rules(m)}${m.mode === 'team' ? meineZelle() : ''}
    ${V.beispiel ? WWH.vorfuehrung(m.type, { zm: m.mode === 'team' ? m.zm : null, breite: '200px' }) : ''}`;
}

// ---- Zellen: Vorschläge der anderen live, Abstimmung oder Zuversicht
const ZM_TEXT = { sprecher: 'Alle sehen eure Vorschläge live. Wer abschickt, entscheidet für die Zelle.',
  mehrheit: 'Abstimmung: Deine Wahl ist deine Stimme. Die Mehrheit gilt für die Zelle.',
  zuversicht: 'Zuversicht: Deine Wahl zählt so stark, wie du sicher bist.' };
function zellModus() { return (ME.zelle && ME.zelle.modus) || 'sprecher'; }
function zuversichtRegler() {
  if (zellModus() !== 'zuversicht') return '';
  const mein = ME.zelle && ME.zelle.mein;
  if (lokal.confKey !== lokal.key) { lokal.confKey = lokal.key; if (mein) lokal.conf = mein.c; }
  return `<div class="zuversicht"><div class="reihe" style="justify-content:space-between"><span class="klein">Wie sicher bist du?</span><span class="klein signal" id="confwert">${lokal.conf} %</span></div>
    <input type="range" min="0" max="100" step="5" data-k="conf" id="conf" value="${lokal.conf}"></div>`;
}
function zellVorschlaege(darstellen, uebernehmen) {
  const z = ME.zelle; if (!z) return '';
  const andere = z.vorschlaege.filter(x => x.id !== ME.id);
  const n = z.vorschlaege.length;
  let h = `<div class="klein">${esc(ZM_TEXT[z.modus] || '')}${z.modus !== 'sprecher' ? ` · ${n} von ${z.groesse} haben gewählt` : ''}</div>`;
  if (!andere.length) return h;
  return h + `<div class="vorschlaege">${andere.map(x => `<div class="vorschlag"><div class="kopf2"><b>${esc(x.code)}${V.namenZeigen ? ' <span class="klein">' + esc(x.name) + '</span>' : ''}</b>
      ${z.modus === 'zuversicht' ? `<span class="klein">${x.c} % sicher</span>` : ''}</div>${darstellen(x.v)}
      ${z.modus === 'zuversicht' ? `<div class="balken"><i style="width:${x.c}%"></i></div>` : ''}
      ${uebernehmen && V.open && !V.revealed ? `<button class="btn klein" data-do="${uebernehmen}" data-x="${esc(x.v)}">Übernehmen</button>` : ''}</div>`).join('')}</div>`;
}
function zelleSenden(v, final) { senden({ v, c: lokal.conf, kind: final || zellModus() !== 'sprecher' ? undefined : 'vorschlag' }); }

function finale() {
  const pos = V.ranking.findIndex(r => r.id === ME.id), art = V.finaleArt, F = SY().finale || {}, st = V.statistik || {};
  if (art === 'uebergabe') return `<span class="stempel" style="align-self:flex-start;font-size:22px;">Übergabe</span><h1>Die Übergabe</h1><p class="text">${esc(F.uebergabe || '')}</p><div class="klein">In deinem Rucksack: ${ME.total} Wörter</div>`;
  if (art === 'maulwurf') {
    const mw = V.maulwurf;
    if (!mw) return (V.mole.voteOpen ? maulwurfWahl() : `<h1>${esc(V.mole.frage)}</h1><p class="pause">Die Zentrale wertet die Stimmen aus …</p>`) + rolle();
    return `<span class="stempel" style="align-self:flex-start;font-size:22px;">${mw.caught ? 'Enttarnt' : 'Entkommen'}</span>
      <h1>${mw.code === ME.code ? 'Das warst du.' : esc(mw.code)}</h1><p class="text">${mw.code === ME.code ? '' : 'alias ' + esc(mw.name) + '. '}${esc(mw.text)}</p>`;
  }
  if (art === 'ziel') {
    const z = V.zielErgebnis || {};
    return `<span class="stempel" style="align-self:flex-start;font-size:22px;">${z.erreicht ? 'Gerettet' : 'Verloren'}</span>
      <h1>${z.stand} / ${z.ziel}</h1><p class="text">${esc(fuelle(z.erreicht ? F.zielErreicht : F.zielVerfehlt, z))}</p>
      ${z.maulwurfRaus && z.maulwurfBekannt ? `<p class="pause">${esc(F.maulwurfZaehlt || '')}</p>` : ''}`;
  }
  if (art === 'hueter' && V.zielErgebnis && !V.zielErgebnis.erreicht)
    return `<h1>Kein Hüter</h1><p class="text">Das Archiv ist verloren. Übrig bleiben die Rucksäcke.</p>
      <div class="rang">${V.ranking.map((r, i) => `<div class="${r.id === ME.id ? 'ich' : ''}"><span>${pad(i + 1)}</span><b>${esc(r.code)}</b><span>${r.total}</span></div>`).join('')}</div>`;
  if (art === 'akten') return `<h1>Personalakten</h1>` + (V.akten || []).map(a => `<div class="karte"><div class="klein">${esc(a.titel)}</div><h2>${a.codes.map(esc).join(' & ')}</h2><p class="text" style="font-size:16px">${a.wert} ${esc(a.was)}</p></div>`).join('');
  if (art === 'epilog') return `<div class="klein">Epilog ${V.epilog.nr} / ${V.epilog.von}</div><h1>${esc(V.epilog.titel)}</h1><p class="text">${esc(V.epilog.text)}</p>`;
  if (art === 'abspann') return `<h1>Ende</h1><p class="text" style="white-space:pre-line">${esc(V.abspann.text)}</p><div class="klein">Danke, ${esc(ME.code)}.</div>${impressumLink()}`;
  if (art === 'kartei') return `<h1>${esc(F.gerettet || 'Das habt ihr gerettet')}</h1><div class="klein">${V.beute.length} Karteikarten</div>
    <div class="kartei" style="grid-template-columns:1fr">${V.beute.map(k => WWH.karte(k, { klein: true })).join('')}</div>`;
  if (art === 'bilanz') return (V.beute && V.beute.length ? `<div class="karte"><div class="klein">${esc(F.gerettet || 'Das habt ihr gerettet')}</div><p class="text">${V.beute.map(b => esc(b.wort)).join(' · ')}</p></div>` : '') + `<h1>${esc(F.frage || '')}</h1>${st.umgelagert ? `<p class="text">${st.umgelagert} Wörter haben unterwegs den Rucksack gewechselt – ${st.anteil} % der gesamten Beute.</p>` : `<p class="text">${esc(F.keine || '')}</p>`}
    <div class="klein">Dein Rucksack: ${ME.total} Wörter · Platz ${pos + 1}</div>`;
  return `<span class="stempel" style="align-self:flex-start;font-size:22px;">${pos === 0 ? 'Hüter' : 'Übergeben'}</span>
    <h1>${pos === 0 ? esc(F.hueter || 'Du führst den Widerstand an') : 'Platz ' + (pos + 1)}</h1>
    <div class="rang">${V.ranking.map((r, i) => `<div class="${r.id === ME.id ? 'ich' : ''}"><span>${pad(i + 1)}</span><b>${esc(r.code)}</b><span>${r.total}</span></div>`).join('')}</div>`;
}

function gesendet(txt) { return `<div class="ok">✓ ${esc(txt)}</div>`; }
function zu() { return `<p class="pause">Abgabe geschlossen.</p>`; }

function einheitPunkte() {
  const u = V.stage.scores || [];
  return `<div class="klein">${u.map(x => esc(x.label) + ' ' + x.pts).join(' · ')}</div>`;
}

function deppardy(st) {
  let h = `<div class="klein">Deppardy · ${esc(st.name)}</div>`;
  const c = st.cell;
  if (!c) return h + `<p class="pause">Die Moderation wählt das nächste Feld.</p>` + einheitPunkte();
  h += `<div class="feldwert"><h2>${esc(c.cat)}</h2><b>${c.value}</b></div>${c.risk ? '<div><span class="risiko">Risiko ×2</span></div>' : ''}
    <p class="text">${esc(c.q)}</p>`;
  if (c.hint) h += `<p class="pause">Tipp: ${esc(c.hint)}</p>`;
  if (st.stage < 2) {
    if (ME.wrong) h += `<p class="pause">Für diese Frage gesperrt.</p>`;
    else if (ME.buzzPos) h += `<div class="karte hell"><h2>${ME.buzzPos === 1 ? 'Du bist dran!' : 'Platz ' + ME.buzzPos + ' in der Reihe'}</h2></div>`;
    else if (ME.sperre && ME.sperre > V.now) h += `<button class="buzzer" disabled style="opacity:.4">Gesperrt</button><p class="pause">Zu früh gedrückt – gleich wieder frei.</p>`;
    else h += `<button class="buzzer" data-do="buzz" style="${st.armed ? '' : 'filter:grayscale(.7);opacity:.75'}">Buzzer</button>
      ${st.armed ? '<div class="klein signal" style="text-align:center">Frei – drücken!</div>' : '<div class="klein" style="text-align:center">Warte, bis die Moderation freigibt. Wer zu früh drückt, ist 2 Sekunden gesperrt.</div>'}`;
  } else h += `<div class="karte hell"><div class="klein" style="color:#5c5446">Antwort</div><p class="text">${esc(c.a)}</p></div>` + (c.karte ? WWH.karte(c.karte, { neu: true }) : '');
  return h + einheitPunkte();
}

function atlasText(st) {
  let h = `<div class="klein">${esc(st.set)} · Runde ${V.round + 1} / ${V.mission.rounds}</div><p class="pause" style="margin:0">${esc(st.marke)}</p><h1>${esc(st.text)}</h1>`;
  if (V.mission.mode === 'team') h += meineZelle();
  if (V.revealed) {
    const r = ME.res;
    h += `<div class="karte hell"><div class="klein" style="color:#5c5446">Richtig</div><h2>${esc(st.zielName)}</h2>
      ${r ? `<p class="text">${r.hit ? 'Volltreffer' : r.nb ? 'Nachbarland' : Math.round(r.km).toLocaleString('de-DE') + ' km daneben'} · <b>${r.pts} Punkte</b></p>` : '<p class="text">Kein Tipp abgegeben.</p>'}
      ${st.notiz ? `<p class="text" style="font-size:16px">${esc(st.notiz)}</p>` : ''}</div>` + (st.karte ? WWH.karte(st.karte, { neu: true }) : '');
  } else if (ME.tip) h += gesendet('Tipp: ' + (atlasKarte ? atlasKarte.name(ME.tip) : ME.tip) + (V.mission.mode === 'team' ? (zellModus() === 'sprecher' ? ' (für die Zelle)' : ' (Ergebnis der Zelle)') : ''));
  if (V.open && !V.revealed && ME.zelle) h += zuversichtRegler() + zellVorschlaege(k => `<span class="serif">${esc(atlasKarte ? atlasKarte.name(k) : k)}</span>`, 'atlasnimm');
  if (!V.open && !V.revealed) h += zu();
  return h;
}

// ---- Atlas: Karte bleibt stehen, nur Markierungen ändern sich
const atlasBox = document.getElementById('atlasbox'), atlasWahl = document.getElementById('atlaswahl'), atlasSenden = document.getElementById('atlassenden');
let atlasKarte = null, atlasLaedt = false;
async function atlas() {
  const aktiv = ME && V && V.screen === 'mission' && V.phase === 'play' && V.stage && V.stage.type === 'atlas';
  atlasBox.hidden = !aktiv;
  if (!aktiv) return;
  if (!atlasKarte) {
    if (atlasLaedt) return; atlasLaedt = true;
    atlasKarte = await Karte.erstellen(document.getElementById('atlaskarte'), { onPick: k => {
      if (!V.open || V.revealed || (atlasKarte.geo[k] && atlasKarte.geo[k].kein)) return;
      lokal.wahl = k; atlasMalen();
    } });
    render(app, spiel());
  }
  atlasMalen();
}
function atlasMalen() {
  if (!atlasKarte) return;
  const st = V.stage, kl = {};
  if (ME.zelle) ME.zelle.vorschlaege.forEach(x => { if (x.id !== ME.id) kl[x.v] = 'vorschlag'; });
  if (ME.tip) kl[ME.tip] = 'tipp';
  if (lokal.wahl) kl[lokal.wahl] = 'gewaehlt';
  if (V.revealed) (st.ziele || []).forEach(z => kl[z] = (kl[z] ? kl[z] + ' ' : '') + 'ziel');
  atlasKarte.klassen(kl);
  atlasKarte.notizen(V.revealed && ME.res && !ME.res.hit ? { pins: [{ key: ME.res.tip, label: ME.res.pts + ' P.' }], linien: [{ von: ME.res.tip, nach: ME.res.ziel }] } : { pins: [], linien: [] });
  const offen = V.open && !V.revealed;
  atlasWahl.textContent = lokal.wahl ? atlasKarte.name(lokal.wahl) : (ME.tip ? atlasKarte.name(ME.tip) : '');
  const mein = ME.zelle && ME.zelle.mein, abstimmen = ME.zelle && ME.zelle.modus !== 'sprecher';
  atlasSenden.disabled = !offen || !lokal.wahl || lokal.wahl === (abstimmen ? mein && mein.v : ME.tip);
  atlasSenden.textContent = abstimmen ? (mein ? 'Stimme ändern' : 'Meine Stimme abgeben') : ME.tip && offen ? 'Tipp ändern' : 'Tipp abschicken';
  atlasSenden.hidden = V.revealed;
  document.getElementById('atlashinweis').textContent = V.revealed ? 'Aufgelöst' : offen ? 'Land antippen, mit zwei Fingern zoomen' : 'Abgabe geschlossen';
}
atlasSenden.onclick = async () => { const k = lokal.wahl; if (!k) return; await senden({ v: k, c: lokal.conf }); lokal.wahl = null; };

function spiel() {
  const st = V.stage, m = V.mission, t = st.type, offen = V.open && !V.revealed;
  if (t === 'maulwurf_los') return `<div class="klein">${esc(m.name)}</div><h1>Eure Rollen</h1><p class="text">Tippe die Karte an – aber so, dass niemand mitliest.</p>${rolle()}`;
  if (t === 'maulwurf_wahl') return `<div class="klein">${esc(m.name)}</div>${ME.moleVote ? '' : '<p class="pause">Oben abstimmen. Ändern geht bis zur Übergabe.</p>'}${rolle()}`;
  if (t === 'deppardy') return deppardy(st);
  if (t === 'atlas') return atlasText(st);
  return spielInnen(st, m, t, offen) + (st.karte ? WWH.karte(st.karte, { neu: true }) : '');
}

function spielInnen(st, m, t, offen) {
  let h = `<div class="klein">${V.test ? '<span class="signal">Testlauf</span> · ' : ''}${esc(m.name)} · Runde ${V.round + 1} / ${m.rounds}</div>`;

  if (t === 'schaetzen') {
    h += `<p class="text">${esc(st.q)}</p>`;
    if (offen) h += `<div class="reihe"><input class="feld gross" data-k="schaetz" id="eingabe" inputmode="decimal" placeholder="Zahl" style="flex:1"></div>${st.unit ? `<div class="klein">in ${esc(st.unit)}</div>` : ''}
      <button class="btn rot voll" data-do="antwort">${ME.answer ? 'Schätzung ändern' : 'Schätzung abschicken'}</button>`;
    if (ME.answer) h += gesendet('Abgegeben: ' + ME.answer + (st.unit ? ' ' + st.unit : ''));
    if (!offen && !V.revealed) h += zu();
    if (V.revealed) h += `<div class="karte hell"><div class="klein" style="color:#5c5446">Lösung</div><h2>${esc(Number.isNaN(WWH.deNum(st.a)) ? st.a : WWH.deNum(st.a).toLocaleString('de-DE'))} ${esc(st.unit || '')}</h2>${(st.closest || []).includes(ME.id) ? '<b style="color:#c23522">Du warst am nächsten dran.</b>' : ''}</div>`;
  }

  else if (t === 'ranking') {
    h += `<p class="text">${esc(st.q)}</p>` + meineZelle();
    const text = Object.fromEntries(st.items.map(it => [it.letter, it.text]));
    const liste = v => `<ol>${v.split('').map(l => `<li>${esc(text[l] || '?')}</li>`).join('')}</ol>`;
    const mein = ME.zelle && ME.zelle.mein;
    if (!lokal.reihe || lokal.reihe.length !== st.items.length) lokal.reihe = (mein ? mein.v : ME.teamAnswer ? ME.teamAnswer.v : st.items.map(it => it.letter).join('')).split('');
    if (offen) {
      h += `<div class="klein">Karten festhalten und an ihren Platz ziehen – oben zuerst</div>
        <ol class="sortierliste" id="sortier">${lokal.reihe.map((l, i) => `<li data-l="${l}"><span class="griff" aria-hidden="true">⠿</span><span class="nr">${pad(i + 1)}</span><span>${esc(text[l])}</span>
          <span class="pfeile"><button data-do="hoch" data-i="${i}" ${i ? '' : 'disabled'} aria-label="nach oben">↑</button><button data-do="runter" data-i="${i}" ${i < lokal.reihe.length - 1 ? '' : 'disabled'} aria-label="nach unten">↓</button></span></li>`).join('')}</ol>`
        + zuversichtRegler()
        + (zellModus() === 'sprecher' ? `<button class="btn rot voll" data-do="folge">${ME.teamAnswer ? 'Neue Reihenfolge abschicken' : 'Für die Zelle abschicken'}</button>`
          : `<button class="btn rot voll" data-do="folge">${mein ? 'Stimme aktualisieren' : 'Meine Reihenfolge abgeben'}</button>`);
      h += zellVorschlaege(liste, 'reihe');
    } else if (!V.revealed) h += zu();
    if (ME.teamAnswer) h += `<div class="karte"><div class="ok">✓ Für die Zelle abgegeben (${esc(ME.teamAnswer.by)})</div><div class="vorschlag" style="border:none;padding:0;background:none">${liste(ME.teamAnswer.v)}</div></div>`;
    if (V.revealed) {
      const ok = ME.teamAnswer && ME.teamAnswer.v === st.code;
      h += `<div class="karte hell"><div class="klein" style="color:#5c5446">Richtige Reihenfolge</div><ol class="regeln" style="color:#15130f">${st.solution.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${ME.teamAnswer ? `<b style="color:#c23522">${ok ? 'Eure Zelle lag richtig.' : 'Nicht ganz.'}</b>` : ''}</div>`;
    }
  }

  else if (t === 'hoeher') {
    const cur = ME.teamAnswer && ME.teamAnswer.v, anders = st.claim === 'A' ? st.b : st.a, mein = ME.zelle && ME.zelle.mein;
    const wahl = zellModus() === 'sprecher' ? cur : mein && mein.v, txt = { W: 'Wahrheit', P: 'Propaganda' };
    h += WWH.plakat({ ruf: st.claimName, unter: `${st.q} – ${st.claimName}, nicht ${anders}.`, urteil: V.revealed ? st.wahr : null }) + meineZelle();
    if (offen) h += zuversichtRegler();
    h += `<div class="ab">${[['W', 'Wahrheit'], ['P', 'Propaganda']].map(([x, l]) => `<button data-do="ab" data-x="${x}" class="${wahl === x ? 'an' : ''}" ${offen ? '' : 'disabled'}><b style="font-size:26px">${l}</b></button>`).join('')}</div>`;
    if (offen) h += zellVorschlaege(v => `<span class="serif">${txt[v] || v}</span>`);
    if (ME.teamAnswer) h += gesendet(`Zelle sagt ${ME.teamAnswer.v === 'W' ? 'Wahrheit' : 'Propaganda'} (${ME.teamAnswer.by})`);
    if (!offen && !V.revealed) h += zu();
    if (V.revealed) h += `<div class="karte hell"><div class="klein" style="color:#5c5446">${st.wahr === 'W' ? 'Es stimmt' : 'Propaganda'}</div>
      <p class="text">${esc(st.a)}: ${esc(st.av)} · ${esc(st.b)}: ${esc(st.bv)}</p>${cur ? `<b style="color:#c23522">${cur === st.wahr ? 'Eure Zelle hat es durchschaut.' : 'Reingefallen.'}</b>` : ''}</div>`;
  }

  else if (t === 'woerterbuch') {
    h += `<div class="karte"><div class="klein">Beschlagnahmt</div><h1>${esc(st.wort)}</h1>${st.art ? `<div class="klein">${esc(st.art)}</div>` : ''}</div>`;
    if (st.phase === 'faelschen') {
      if (ME.treffer) h += `<div class="karte hell"><h2>Treffer!</h2><p class="text">Du kanntest die echte Bedeutung. Deine Wörter sind sicher.</p></div>`;
      else if (offen) h += `<div class="klein">Erfinde eine Bedeutung, die echt klingt</div>
        <textarea class="feld gross" data-k="faelschung" id="eingabe" rows="3" maxlength="160" placeholder="z. B. Ein alter Brauch, bei dem …">${esc(ME.answer || '')}</textarea>
        <button class="btn rot voll" data-do="faelschen">${ME.answer ? 'Fälschung ändern' : 'Fälschung abgeben'}</button>`;
      if (ME.answer && !ME.treffer) h += gesendet('Abgegeben');
    } else {
      const opt = st.optionen || [];
      if (!V.revealed) {
        h += `<div class="klein">Welche Bedeutung ist die echte?</div><div class="optionen">${opt.map(o => `<button data-do="wbwahl" data-x="${o.nr}" class="${ME.vote === o.nr ? 'an' : ''}" ${o.nr === ME.eigeneNr || !offen ? 'disabled' : ''}><span class="bu">${'ABCDEFGHIJKLMNOP'[o.nr]}</span>${esc(o.text)}${o.nr === ME.eigeneNr ? ' <span class="klein">(deine)</span>' : ''}</button>`).join('')}</div>`;
        if (ME.vote != null) h += gesendet('Stimme abgegeben');
      } else {
        const code = id => ((V.agents.find(a => a.id === id) || {}).code || '?');
        h += `<div class="optionen">${opt.map(o => `<button disabled style="opacity:1;${o.echt ? 'border-color:var(--gruen);background:#1f2616' : ''}"><span class="bu">${'ABCDEFGHIJKLMNOP'[o.nr]}</span><span>${esc(o.text)}<br><span class="klein">${o.echt ? 'Die echte Bedeutung' : 'Fälschung von ' + esc(code(o.von))} · ${o.stimmen.length} Stimme${o.stimmen.length === 1 ? '' : 'n'}</span></span></button>`).join('')}</div>`;
      }
    }
  }

  else if (t === 'schwaerzung') {
    const balken = '█'.repeat(Math.max(3, st.laenge || 5));
    h += `<div class="textblock">${esc(st.vor)}${V.revealed ? `<b style="color:#c23522">${esc(st.wort)}</b>` : `<span class="schwarz">${balken}</span>`}${esc(st.nach)}</div>
      ${st.quelle ? `<div class="klein">${esc(st.quelle)}</div>` : ''}${st.takt && offen ? '<div class="taktuhr" id="taktuhr"></div>' : ''}`;
    if (offen) h += `<input class="feld gross" data-k="schwarz" id="eingabe" placeholder="Was stand unter dem Balken?" autocomplete="off" enterkeyhint="send">
      <button class="btn rot voll" data-do="antwort">${ME.answer ? 'Antwort ändern' : 'Antwort abgeben'}</button>`;
    if (ME.answer) h += gesendet('Abgegeben: ' + ME.answer);
    if (!offen && !V.revealed) h += zu();
    if (V.revealed && ME.judged === 'r') h += `<div class="karte hell"><h2>Richtig!${ME.wert ? ' +' + ME.wert : ''}</h2></div>`;
  }

  else if (t === 'impostor') {
    const s = ME.secret || {};
    h += `<div class="geheim ${lokal.offen ? '' : 'zu'}" data-do="geheim">${lokal.offen
      ? (s.spy ? `<div class="klein" style="color:#c23522">Du bist der Eindringling</div><div class="display">${esc(s.cat)}</div><div class="serif">Das ist nur die Kategorie. Tarne dich.</div>`
               : `<div class="klein" style="color:#5c5446">Die Parole</div><div class="display">${esc(s.word)}</div><div class="serif">Nicht weitersagen.</div>`)
      : `<div class="display" style="font-size:32px">Geheimsache</div><div class="serif">Antippen zum Aufdecken, nochmal antippen zum Verdecken. Niemand soll mitlesen.</div>`}</div>`;
    if (offen) {
      h += `<div class="klein">Wer ist der Eindringling?</div><div class="stimmen">${V.agents.filter(a => a.id !== ME.id).map(a => `<button data-do="stimme" data-x="${a.id}" class="${ME.vote === a.id ? 'an' : ''}"><b>${esc(a.code)}</b><span>${esc(a.name)}</span></button>`).join('')}</div>`;
      if (ME.vote) h += gesendet('Stimme abgegeben');
    } else if (!V.revealed) h += `<p class="pause">Reihum ein Wort zur Parole nennen. Die Abstimmung öffnet die Moderation.</p>`;
    if (V.revealed) h += `<div class="karte hell"><div class="klein" style="color:#5c5446">Der Eindringling war</div><h2>${esc(st.spy)}</h2><p class="text">Parole: ${esc(st.word)} · Kategorie: ${esc(st.cat)}</p></div>`;
  }

  else if (t === 'zoom' || t === 'sound' || t === 'emoji') {
    if (t === 'emoji') h += `<div class="emojizeile" data-fit="0.2" style="font-size:64px;line-height:1.15;text-align:center">${esc(st.e)}</div>${st.cat ? `<div class="klein" style="text-align:center">Kategorie: ${esc(st.cat)}</div>` : ''}`;
    if (st.takt && offen && ME.judged !== 'r') h += `<div class="taktuhr" id="taktuhr"></div>`;
    else h += `<p class="pause">${t === 'zoom' ? 'Das Beweisfoto ist auf der Leinwand.' : 'Das Band läuft über die Leinwand' + (st.stufe && !V.revealed ? ` – Rauschen Stufe ${st.stufe} von ${st.stufen}` : '') + '.'}</p>`;
    if (offen && ME.triesLeft > 0 && ME.judged !== 'r') h += `<input class="feld gross" data-k="buzz" id="eingabe" placeholder="Antwort" autocomplete="off" enterkeyhint="send">
      <button class="btn rot voll" data-do="funk">Antwort funken</button><div class="klein">Noch ${ME.triesLeft} Versuche</div>`;
    if (ME.judged === 'r') h += `<div class="karte hell"><h2>Treffer!${ME.wert ? ' +' + ME.wert : ''}</h2></div>`;
    if (ME.tries && ME.tries.length) h += `<ul class="versuche">${ME.tries.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    if (!offen && !V.revealed) h += zu();
    if (V.revealed) h += `<div class="karte hell"><div class="klein" style="color:#5c5446">Lösung</div><h2>${esc(st.a)}</h2></div>`;
  }

  else if (t === 'wette') {
    h += `<div class="karte"><div class="klein">Kategorie</div><h2>${esc(st.cat)}</h2></div>`;
    if (!st.q) {
      h += `<div class="klein">Dein Einsatz – höchstens ${ME.betCap} Wörter</div>
        <div class="reihe"><input class="feld gross" data-k="einsatz" id="eingabe" inputmode="numeric" placeholder="0–${ME.betCap}" style="flex:1"></div>
        <button class="btn rot voll" data-do="einsatz">${ME.bet != null ? 'Einsatz ändern' : 'Einsatz setzen'}</button>`;
      if (ME.bet != null) h += gesendet('Einsatz: ' + ME.bet + ' Wörter');
    } else {
      h += `<p class="text">${esc(st.q)}</p>${ME.bet != null ? `<div class="klein">Dein Einsatz: ${ME.bet}</div>` : '<div class="klein">Kein Einsatz gesetzt</div>'}`;
      if (offen && st.opts && st.opts.length) h += `<div class="optionen">${st.opts.map((o, i) => `<button data-do="wwahl" data-x="${esc(o)}" class="${ME.answer === o ? 'an' : ''}"><span class="bu">${'ABCDEFGH'[i]}</span>${esc(o)}</button>`).join('')}</div>`;
      else if (offen) h += `<input class="feld gross" data-k="wantwort" id="eingabe" placeholder="Antwort" autocomplete="off"><button class="btn rot voll" data-do="antwort">${ME.answer ? 'Antwort ändern' : 'Antwort abschicken'}</button>`;
      if (ME.answer) h += gesendet('Abgegeben: ' + ME.answer);
      if (!offen && !V.revealed) h += zu();
      if (V.revealed) h += `<div class="karte hell"><div class="klein" style="color:#5c5446">Lösung</div><h2>${esc(st.a)}</h2>${ME.betDone ? `<b style="color:#c23522">${ME.betDone === 'r' ? 'Einsatz gewonnen' : 'Einsatz verloren'}</b>` : ''}</div>`;
    }
  }
  return h;
}

function wert() { const e = document.getElementById('eingabe'); return e ? e.value.trim() : ''; }
function leeren() { const e = document.getElementById('eingabe'); if (e) e.value = ''; }

actions(app, {
  beitreten: async () => {
    const n = document.getElementById('name').value.trim();
    if (!n) return hinweis('Bitte einen Namen eingeben');
    try { const d = await post('/api/join', { name: n }); token = d.token; try { localStorage.setItem('wwh_token', token); } catch (e) {} location.reload(); }
    catch (e) { hinweis(e.message); }
  },
  antwort: () => { const v = wert(); if (!v) return hinweis('Erst etwas eintippen'); senden({ v }); leeren(); },
  funk: () => { const v = wert(); if (!v) return; senden({ v }); leeren(); lokal.fokus = null; const e = document.getElementById('eingabe'); if (e) e.focus(); },
  einsatz: () => { senden({ kind: 'bet', v: parseInt(wert()) || 0 }); leeren(); },
  folge: () => zelleSenden(lokal.reihe.join(''), true),
  hoch: d => { const i = +d.i, r = lokal.reihe; [r[i - 1], r[i]] = [r[i], r[i - 1]]; reiheGeaendert(); },
  runter: d => { const i = +d.i, r = lokal.reihe; [r[i + 1], r[i]] = [r[i], r[i + 1]]; reiheGeaendert(); },
  reihe: d => { lokal.reihe = d.x.split(''); reiheGeaendert(); },
  atlasnimm: d => { lokal.wahl = d.x; atlasMalen(); },
  ab: d => zelleSenden(d.x, true),
  wwahl: d => senden({ v: d.x }),
  mantrag: () => { if (confirm('Ein anonymes Misstrauensvotum für die ganze Zelle beantragen? Pro Einsatz geht das nur einmal.')) senden({ kind: 'misstrauen_antrag' }); },
  mmisstrauen: d => senden({ kind: 'misstrauen', v: d.x }),
  uopfer: d => { lokal.opfer = d.x; if (lokal.ziel === d.x) lokal.ziel = null; zeichnen(); },
  uziel: d => { lokal.ziel = d.x; zeichnen(); },
  umlagern: () => { senden({ kind: 'steal', v: lokal.opfer, ziel: lokal.ziel || ME.id }); lokal.opfer = lokal.ziel = null; },
  uverzicht: () => { if (confirm('Wirklich verzichten?')) senden({ kind: 'steal_skip' }); },
  stimme: d => senden({ v: d.x }),
  geheim: () => { lokal.offen = !lokal.offen; zeichnen(); },
  rolle: () => { lokal.rolleOffen = !lokal.rolleOffen; zeichnen(); },
  misstrauenok: () => { lokal.gesehenMisstrauen = V.misstrauen.letztes.n; zeichnen(); },
  mstimme: d => senden({ kind: 'mole_vote', v: d.x }),
  faelschen: () => { const v = wert(); if (!v) return hinweis('Erst etwas eintippen'); senden({ v }); },
  wbwahl: d => senden({ v: +d.x }),
  buzz: () => { if (navigator.vibrate) navigator.vibrate(60); senden({ kind: 'buzz' }); },
});
// Karteikarten ziehen (Registratur). Jede neue Reihenfolge geht live als Vorschlag an die Zelle.
function reiheGeaendert() {
  zeichnen();
  clearTimeout(reiheGeaendert.t);
  reiheGeaendert.t = setTimeout(() => { if (V && V.open && !V.revealed) zelleSenden(lokal.reihe.join('')); }, 400);
}
WWH.sortierbar(app, '#sortier', reihe => { lokal.reihe = reihe; reiheGeaendert(); });
// Zuversicht: Regler schickt die aktuelle Wahl mit neuem Gewicht
app.addEventListener('input', e => { if (e.target.id === 'conf') { lokal.conf = +e.target.value; const w = document.getElementById('confwert'); if (w) w.textContent = lokal.conf + ' %'; } });
app.addEventListener('change', e => {
  if (e.target.id !== 'conf') return;
  const mein = ME.zelle && ME.zelle.mein;
  if (mein) senden({ v: mein.v, c: lokal.conf });
});

app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const k = e.target.dataset && e.target.dataset.k;
  const map = { name: 'beitreten', schaetz: 'antwort', buzz: 'funk', einsatz: 'einsatz', wantwort: 'antwort', schwarz: 'antwort' };
  if (map[k]) { e.preventDefault(); const b = app.querySelector(`[data-do="${map[k]}"]`); if (b) b.click(); }
});
</script>
</body>
</html>
